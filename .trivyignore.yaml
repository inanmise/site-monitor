# Trivy istisnaları — yayın güvenlik kapısı (2026-11-16).
#
# release.yml ve docker-build.yml imajı HIGH / CRITICAL bulguda DURDURUR (exit-code 1, ignore-unfixed). Bu dosya
# bilinçli istisnaların TEK yeridir. Her istisna:
#   1. YOL KAPSAMLI olmalı (`paths`): aynı CVE başka bir dosyada çıkarsa yine durdurur;
#   2. SON TARİHLİ olmalı (`expired_at`): tarih geçince istisna kendiliğinden düşer ve yayın yeniden durur —
#      sorunu kapatın ya da gerekçeyi gözden geçirip tarihi yenileyin;
#   3. GEREKÇELİ olmalı (`statement`): neden şimdi kapatılamadığı ve ne zaman kapanacağı.
# Biçim: https://trivy.dev/docs/latest/configuration/filtering/#trivyignoreyaml (Trivy ≥ 0.47).
# Ayrıntı: docs/RUNBOOK.md "Yayın güvenlik kapısı (Trivy)".
#
# Şu an istisna yok (2026-11-20). k6 2.3.0 bloğu (5 CVE, usr/bin/k6 — go1.26.8, golang.org/x/net v0.58.0) k6 2.3 → 2.4
# terfisiyle SİLİNDİ: 2.3.0 imajdan çıktı, /usr/bin/k6 artık 2.4.0 (go1.26.11, x/net v0.62.0). Terfiyi tetikleyen bulgu:
# CVE-2026-97054 (Go net/http HTTP/1 sunucusu MaxBytesReader yarışı; go 1.26.11'de kapalı) — istisna EKLENMEDİ, ikili
# yükseltildi (kullanıcı kararı).
#
# `vulnerabilities` anahtarı BOŞ LİSTE olarak durmalı — silmeyin: dosya yalnız yorumdan oluşursa geçerli bir YAML belgesi
# kalmaz (boş belge) ve Trivy'nin YAML okuyucusu bunu ayrıştırma hatası sayabilir (boş belge denenmedi; boş liste güvenli
# biçim). Yeni bir istisna bu listeye yukarıdaki üç kuralla eklenir:
#   - id: CVE-YYYY-NNNNN
#     paths:
#       - "usr/bin/ornek"
#     expired_at: 2027-01-31
#     statement: >-
#       Neden şimdi kapatılamıyor, ne zaman kapanacak.

vulnerabilities: []
