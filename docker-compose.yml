services:
  site-monitor:
    build:
      context: .
      args:
        # Sürümün tek kaynağı kök VERSION dosyası: `VERSION=$(cat VERSION) docker compose build`
        # (eskiden sabit "1.0.0" idi — imaj etiketi ve OCI label 20 major geride kalıyordu).
        VERSION: "${VERSION:-0.0.0-local}"
        BUILD_DATE: "${BUILD_DATE:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
        K6_VERSION: "${K6_VERSION:-0.49.0}"
    image: site-monitor:${VERSION:-local}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
