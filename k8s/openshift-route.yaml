# LEGACY / UNMAINTAINED - the production source of truth is helm/site-monitor. Do not kubectl apply
# this file as-is: see k8s/README.md for the known incompatibilities.
# OpenShift Route (alternative to Ingress)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: site-monitor
  namespace: site-monitor
  labels:
    app: site-monitor
spec:
  host: site-monitor.apps.your-cluster.example.com   # Replace with your route
  to:
    kind: Service
    name: site-monitor
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
