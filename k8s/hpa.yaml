# LEGACY / UNMAINTAINED - the production source of truth is helm/site-monitor. Do not kubectl apply
# this file as-is: see k8s/README.md for the known incompatibilities.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: site-monitor
  namespace: site-monitor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: site-monitor
  # Tek pod profilinde bu HPA UYGULANMAZ; yatay olceklemeye gecilirse kullanilir.
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
