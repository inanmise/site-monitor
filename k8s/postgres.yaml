---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: site-monitor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi   # 10Gi düşüktü — büyüme projeksiyonu (activity_log + 30sn serileri) için 20Gi başlangıç
  storageClassName: standard   # Replace with your storage class

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: site-monitor
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          # ── Sunucu ayarları (stok postgres:16-alpine varsayılanları çok küçük: shared_buffers=128MB,
          #    work_mem=4MB, pg_stat_statements yok). Entrypoint '-' ile başlayan arg'lara 'postgres'
          #    ekler → `postgres -c ...`. Değerler 2Gi bellek limitine göre (shared_buffers ~%25). ──
          args:
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "effective_cache_size=1536MB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "maintenance_work_mem=128MB"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=top"
            - "-c"
            # pool(25) × replica; app master overlay 3 replika = 75 + admin/monitoring → 150 headroom.
            - "max_connections=150"
          env:
            - name: POSTGRES_DB
              value: sitemonitor
            - name: POSTGRES_USER
              value: sitemonitor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: site-monitor-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              # 512Mi çok düşüktü (shared_buffers 128MB ~%25'i). shared_buffers=512MB için ≥2Gi gerekir.
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sitemonitor"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sitemonitor"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: site-monitor
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
