apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-monitor
  namespace: cert-monitor
  labels:
    app: cert-monitor
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cert-monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: cert-monitor
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cert-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: cert-monitor
          image: cert-monitor:1.0.0  # Replace with your registry image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cert-monitor-config
            - secretRef:
                name: cert-monitor-secret
          # Resource limits — keep in sync with JAVA_OPTS MaxRAMPercentage.
          # limit.memory=8Gi → JVM heap ≈ 6Gi (75 %). limit.cpu=5000m → 5 cores.
          # To change limits: edit the values below AND update configmap JAVA_OPTS if needed.
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "5000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 12
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cert-monitor
