apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-monitor
  namespace: site-monitor
  labels:
    app: site-monitor
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: site-monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: site-monitor
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: site-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site-monitor
          image: site-monitor:1.0.0  # Replace with your registry image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: site-monitor-config
            - secretRef:
                name: site-monitor-secret
          # Resource limits — keep in sync with JAVA_OPTS MaxRAMPercentage.
          # limit.memory=8Gi → JVM heap ≈ 6Gi (75 %). limit.cpu=5000m → 5 cores.
          # To change limits: edit the values below AND update configmap JAVA_OPTS if needed.
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "5000m"
          # Spring Boot Actuator probe grupları: readiness=readinessState (warmup'ta app REFUSING_TRAFFIC
          # ile gate eder → pod gerçekten hazır olana dek trafik almaz); liveness=livenessState (DB'den
          # bağımsız → gereksiz restart yok). startup readiness'a bakar (app hazır olunca tamamlanır).
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30        # ~300s bootstrap bütçesi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: site-monitor
