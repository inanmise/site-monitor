apiVersion: v1
kind: Secret
metadata:
  name: site-monitor-secret
  namespace: site-monitor
type: Opaque
stringData:
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  # Gmail: SMTP_USER = Gmail adresi, SMTP_PASSWORD = App Password (16 hane)
  # App Password: myaccount.google.com/apppasswords (2FA açık olmalı)
  SMTP_USER: "sitemonitor@gmail.com"
  SMTP_PASSWORD: "REPLACE_WITH_GMAIL_APP_PASSWORD"
  EMAIL_TO: "ops-team@sirket.com"
  EMAIL_FROM: "sitemonitor@gmail.com"
