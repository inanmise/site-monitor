# ─────────────────────────────────────────────────────────────
# secret.example.yaml — Template for Kubernetes secrets.
# NEVER commit your actual secret.yaml to version control.
# Copy this file to secret.yaml and fill in base64-encoded values:
#   echo -n 'my-password' | base64
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: cert-monitor-secret
  namespace: cert-monitor
type: Opaque
stringData:
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  EMAIL_TO: ""
  EMAIL_FROM: "noreply@certmonitor"
