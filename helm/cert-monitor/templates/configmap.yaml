apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cert-monitor.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-monitor.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfile | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  EMAIL_ENABLED: {{ .Values.config.emailEnabled | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  CERT_CHECK_TIMEOUT: {{ .Values.config.certCheckTimeout | quote }}
  CERT_WARNING_DAYS: {{ .Values.config.certWarningDays | quote }}
  CERT_PARALLEL_WORKERS: {{ .Values.config.certParallelWorkers | quote }}
  CERT_CHECK_HOUR: {{ .Values.config.certCheckHour | quote }}
  CERT_CHECK_MINUTE: {{ .Values.config.certCheckMinute | quote }}
