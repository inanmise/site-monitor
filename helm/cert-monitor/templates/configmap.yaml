apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cert-monitor.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-monitor.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfile | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_HOST: {{ printf "%s-postgresql" .Release.Name | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | quote }}
  {{- else }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  {{- end }}
  DB_POOL_MAX: {{ .Values.config.dbPoolMax | quote }}
  CERT_MONITOR_EMAIL_ENABLED: {{ .Values.config.emailEnabled | quote }}
  SPRING_MAIL_HOST: {{ .Values.config.smtpHost | quote }}
  SPRING_MAIL_PORT: {{ .Values.config.smtpPort | quote }}
  SPRING_MAIL_SMTP_AUTH: {{ .Values.config.smtpAuth | quote }}
  SPRING_MAIL_SMTP_STARTTLS_ENABLE: {{ .Values.config.smtpStarttlsEnable | quote }}
  SPRING_MAIL_SMTP_STARTTLS_REQUIRED: {{ .Values.config.smtpStarttlsRequired | quote }}
  SPRING_MAIL_SMTP_SSL_TRUST: {{ .Values.config.smtpSslTrust | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  CHECK_TIMEOUT_SECONDS: {{ .Values.config.checkTimeoutSeconds | quote }}
  WARNING_DAYS: {{ .Values.config.warningDays | quote }}
  PARALLEL_WORKERS: {{ .Values.config.parallelWorkers | quote }}
  JAVA_OPTS: {{ .Values.config.javaOpts | quote }}
