# ─────────────────────────────────────────────────────────────────────────────
# Environment: DEVELOPMENT  (develop branch)
# Image tag  : develop-<git-sha>  e.g. site-monitor:develop-a1b2c3d
# Deploy with:
#   helm upgrade --install site-monitor-dev ./helm/site-monitor \
#     -f helm/site-monitor/values.yaml \
#     -f helm/site-monitor/environments/develop.yaml \
#     --set image.tag=develop-$(git rev-parse --short HEAD) \
#     --set secret.adminPassword=devpassword \
#     --set secret.dbPassword=devpassword \
#     -n site-monitor-dev --create-namespace
# ─────────────────────────────────────────────────────────────────────────────

image:
  repository: site-monitor
  tag: develop     # overridden by CI with develop-<sha>
  pullPolicy: Always

replicaCount: 1

config:
  springProfile: prod
  environmentName: dev      # Sürüm & Dağıtım Geçmişi ortam etiketi
  logLevel: "DEBUG"         # dev: ayrıntılı iz sürme (tek replica, hacim sorun değil)
  corsAllowedOrigins: "https://site-monitor-dev.example.com,http://localhost:5173"
  emailEnabled: "false"    # emails off in dev
  # Küçük CPU → düşük paralellik (açılışta CPU oversubscription olmasın)
  executorCoreSize: "4"
  executorMaxSize: "8"
  executorQueueCapacity: "2000"

ingress:
  enabled: true
  className: nginx
  host: site-monitor-dev.example.com
  tls:
    enabled: true
    secretName: site-monitor-dev-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

resources:
  requests:
    memory: "256Mi"
    cpu: "500m"      # warmup'ta JIT+TLS kripto için garanti CPU payı (250m→500m); autoscale yok → HPA etkisi yok
  limits:
    memory: "768Mi"
    cpu: "2000m"     # soğuk-başlangıç CPU burst tavanı (1000m→2000m) → CFS throttling azalır, readiness daha hızlı ACCEPTING

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

topologySpreadConstraints:
  enabled: false
