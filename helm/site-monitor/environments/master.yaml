# -----------------------------------------------------------------------------
# Environment: PRODUCTION  (main branch, released tags only)
# Image      : ghcr.io/<owner>/site-monitor:vX.Y.Z  <- WITH the "v": release.yml pushes only
#              :vX.Y.Z and :latest. An empty image.tag renders v<Chart.AppVersion>.
#
# The ONE supported prod command, with its before/after checks and rollback, is in
# docs/PROD_DEPLOY_CHECKLIST.md. Run it from a checkout of the release tag (git checkout vX.Y.Z):
#
#   helm upgrade --install "$REL" ./helm/site-monitor --namespace "$NS" \
#     -f helm/site-monitor/values.yaml \
#     -f helm/site-monitor/environments/master.yaml \
#     -f "$PRIVATE_VALUES" \
#     --set image.repository="$IMAGE_REPO" \
#     --set image.tag="v${VERSION}" \
#     --set secret.existingSecret="$SECRET" \
#     --set config.logLevel=DEBUG \
#     --atomic --wait --timeout 10m
#
#   REL, NS        the REAL release name / namespace from `helm list -A`. A different name
#                  silently installs a SECOND release (a second Ingress on the same host).
#   PRIVATE_VALUES repo-external file: config.dbHost / dbName / dbUser (+ imagePullSecrets).
#   SECRET         the Secret the running pod already uses - it holds the CURRENT values.
#                  Without existingSecret every secret.* value must be passed with its
#                  CURRENT value, or the values.yaml placeholders overwrite the live Secret.
#   logLevel=DEBUG prod runs DEBUG ON PURPOSE (owner decision). Drop the flag and prod
#                  silently returns to the INFO below.
#   no --reuse-values: this file only reaches prod when it is passed explicitly. Reusing
#                  old values is how dbPoolMax / NO_PROXY / CORS drifted away from it.
#
# !!! SITE_MONITOR_SECRET_KEY: carry the CURRENT value over UNCHANGED. A new key makes every
# !!! stored secret undecryptable - LDAP bind, SMTP password, HTTP/Keyword header secrets,
# !!! personal-push header secrets, PageSpeed key, scripted env secrets - with only a WARN.
# !!! After every deploy: kubectl logs -n "$NS" deploy/<name> | grep -c "decrypt failed"  -> 0
# -----------------------------------------------------------------------------

image:
  # repository: inherited from values.yaml (ghcr.io/<owner>/site-monitor); the deploy command
  # passes it explicitly (internal mirror, if one is used). Never a registry-less name here.
  tag: ""           # empty -> v<Chart.AppVersion>; the deploy command passes image.tag=vX.Y.Z
  pullPolicy: Always

# Üretim TEK POD çalışır (2026-08-19 teyidi). Ölçekleme DİKEY yapılır: kapasite yetmezse
# önce resources büyütülür. Yatay ölçeklemeye geçilecekse aşağıdaki autoscaling /
# podDisruptionBudget / topologySpreadConstraints bloklarını birlikte açın — chart bunları
# destekler ve çok-pod mekanizmaları (scheduler_lock, JDBC oturum) zaten hazırdır.
replicaCount: 1

config:
  springProfile: prod
  environmentName: prod     # Sürüm & Dağıtım Geçmişi ortam etiketi
  # Chart value INFO; PROD RUNS DEBUG ON PURPOSE (owner decision) via --set config.logLevel=DEBUG
  # in the deploy command above. Runtime alternative: Settings -> Logging (DB override, no restart).
  logLevel: "INFO"          # prod: DEBUG pod başına on binlerce satır/gün üretir (console + dosya)
  corsAllowedOrigins: "https://sitemonitor.akbank.com"
  # ── Outbound proxy (kurumsal egress) ────────────────────────────────────────
  # 2026-08 kesintisi: bu değerler yalnız eski release'in --set'lerinde yaşıyordu; certmonitor→
  # sitemonitor taze install'ında taşınmayınca RDAP/registrar sorguları doğrudan çıkışa düşüp
  # firewall'da timeout aldı. KALICI kaynak burasıdır — elle Deployment patch'i yapmayın,
  # sonraki `helm upgrade -f environments/master.yaml` onu ezer (proxy artık buradan gelir).
  httpProxyHost: "dmzproxy.aknet.akb"
  httpProxyPort: "8080"
  # İç hedefler proxy tüneline girmesin (sonek eşleşmesi). Gerekirse genişletin.
  noProxy: "akbank.com,aknet.akb,localhost,127.0.0.1"
  # ── Veritabanı bağlantı havuzu ──────────────────────────────────────────────
  # Çalışan pod 10'da kalmıştı (dağıtılmış eski değer); chart varsayılanı 25, prod için 30'a
  # sabitleniyor. Gerekçe: oturumlar JDBC'de (spring.session.store-type=jdbc), yani HER istek
  # DB'ye uğruyor; buna arka plan işleri (executor 50, parallel-workers 20, scheduling 8)
  # ekleniyor. 10 bağlantı 100 eşzamanlı kullanıcıda ilk darboğaz oluyordu.
  # minimum-idle 10'da bırakıldı (DB_POOL_MIN ezilmiyor): boşta tutulan bağlantı sayısı
  # artmaz, havuz yük geldikçe 30'a kadar büyür.
  # DİKKAT: bu değer POD BAŞINA. Tek pod profilinde DB'de 30 bağlantı demektir; replika
  # sayısını artırırsanız çarpılır (3 replika = 90) ve Postgres max_connections bütçesini
  # birlikte gözden geçirmeniz gerekir.
  dbPoolMax: "30"

ingress:
  enabled: true
  className: nginx
  host: sitemonitor.akbank.com
  tls:
    enabled: true
    secretName: site-monitor-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

# Prod gate 2026-09-26 (owner decision): memory limit 1536Mi -> 3Gi, request 512Mi -> 1.5Gi.
# Why: with -XX:MaxRAMPercentage=75 (values.yaml javaOpts) the heap ceiling was ~1152Mi of a
# 1536Mi limit; metaspace + code cache + ~200 thread stacks (-Xss512k) + NIO buffers + up to two
# concurrent k6 subprocesses (SCRIPTED_POOL_SIZE=2, soft cap GOMEMLIMIT=256MiB each) did not fit
# in the remaining ~384Mi -> OOMKilled risk, and with a single pod OOMKilled = full outage.
# At 3Gi: heap ceiling ~2304Mi, ~768Mi left for non-heap + k6. If working-set memory stays above
# ~85% of the limit, lower MaxRAMPercentage to 70 (config.javaOpts) or the scripted pool size to 1
# (Settings -> Scripted, site.monitor.scripted.pool-size) - see docs/RUNBOOK.md, "Memory".
# CPU unchanged. BEFORE deploying: the namespace ResourceQuota/LimitRange must admit a 3Gi limit
# and a 1.5Gi request - TWICE during the rollout window (maxSurge=1 -> old + new pod together) -
# and a node needs 1.5Gi allocatable, otherwise the new pod stays Pending and --atomic rolls back.
# The chart default (values.yaml, 1792Mi/3584Mi) remains the recommendation for heavy k6 use.
resources:
  requests:
    memory: "1536Mi"   # = 1.5Gi
    cpu: "500m"
  limits:
    memory: "3Gi"
    cpu: "2000m"

# Tek pod profilinde üçü de KAPALI. Değerler, yatay ölçeklemeye geçildiğinde
# doğrudan kullanılabilsin diye korunuyor.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# DİKKAT: tek replikayla minAvailable=2 bir PDB TUZAĞIDIR — voluntary eviction hiçbir zaman
# izin almaz, yani node drain / cluster upgrade süresiz bloke olur. Replika 1 iken kapalı kalmalı.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
