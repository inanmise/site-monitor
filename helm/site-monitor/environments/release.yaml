# ─────────────────────────────────────────────────────────────────────────────
# Environment: STAGING  (release/v* branch)
# Image tag  : {VERSION}-rc  e.g. site-monitor:1.0.0-rc
# Deploy with:
#   helm upgrade --install site-monitor-staging ./helm/site-monitor \
#     -f helm/site-monitor/values.yaml \
#     -f helm/site-monitor/environments/release.yaml \
#     --set image.tag=1.0.0-rc \
#     --set secret.adminPassword=$STAGING_ADMIN_PASSWORD \
#     --set secret.dbPassword=$STAGING_DB_PASSWORD \
#     -n site-monitor-staging --create-namespace
# Optional (Grafana business metrics, /metrics/sitemonitor): add
#     --set secret.metricsExportToken="$STAGING_METRICS_EXPORT_TOKEN"   (>= 32 random chars, same value in Prometheus)
# ─────────────────────────────────────────────────────────────────────────────

image:
  repository: site-monitor
  tag: "1.0.0-rc"    # overridden by CI with {version}-rc
  pullPolicy: Always

# Staging runs the prod multi-pod topology with a FIXED replica count (2026-10-21): two pods share the work through
# the sweep-leader lease and scheduler_lock. Session store stays jdbc (values.yaml default) — helm template fails
# with the in-memory store and more than one pod.
replicaCount: 2

config:
  springProfile: prod
  environmentName: staging  # Sürüm & Dağıtım Geçmişi ortam etiketi
  logLevel: "INFO"
  corsAllowedOrigins: "https://site-monitor-staging.example.com"
  # CPU limiti orta → executor'ı kıs (açılışta CPU açlığını önle)
  executorCoreSize: "8"
  executorMaxSize: "16"
  executorQueueCapacity: "2000"

ingress:
  enabled: true
  className: nginx
  host: site-monitor-staging.example.com
  tls:
    enabled: true
    secretName: site-monitor-staging-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

resources:
  requests:
    memory: "384Mi"
    cpu: "500m"      # request sabit → HPA baseline (%CPU/request) bozulmaz
  limits:
    memory: "1Gi"
    cpu: "2000m"     # soğuk-başlangıç CPU burst tavanı (1500m→2000m) → warmup'ta CFS throttling azalır

# HPA OFF (2026-10-21, multi-pod release 1): the memory metric of a JVM never falls (heap is sized to the limit), so
# the HPA pinned staging at maxReplicas; every scale-in could remove the sweep leader (handover + in-memory alarm
# state reset), and extra pods take no monitoring work anyway (it all runs on the lease holder). The chart also
# renders `replicas` next to an HPA, so each `helm upgrade` fought the HPA's count. Re-enable only after the
# chart change of release 2 (CPU-only metric + behavior block).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
