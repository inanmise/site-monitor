apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "site-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "site-monitor.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "site-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "site-monitor.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Downward API — pod'un koştuğu worker node + pod kimliği (Tanıla'da gösterilir,
            # node'a bağlı egress/akbankpos sorununu korele etmek için).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Sürüm & Dağıtım Geçmişi (2026-09-10): pod kendi ortamını, Helm revizyonunu, imajını ve
            # config checksum'ını bilsin → deployment_history "prod, helm rev 47, yalnız config değişti"
            # diyebilir. Hepsi boş-toleranslı (uygulama env yoksa "bilinmiyor" der). NOT: .Release.Revision
            # pod şablonunda olduğu için her `helm upgrade` pod'u döndürür (checksum/config zaten yapıyor).
            - name: APP_ENVIRONMENT
              value: {{ .Values.config.environmentName | default "" | quote }}
            - name: HELM_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: HELM_RELEASE_REVISION
              value: {{ .Release.Revision | quote }}
            - name: HELM_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: APP_IMAGE_REF
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
            - name: CONFIG_CHECKSUM
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['checksum/config']
          envFrom:
            - configMapRef:
                name: {{ include "site-monitor.fullname" . }}-config
            - secretRef:
                name: {{ include "site-monitor.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Spring Boot Actuator probe grupları (path'ler values.yaml .Values.probes.*).
          # startup app gerçekten hazır olunca (readiness 200) tamamlanır → readiness/liveness devralır.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: 8080
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: tmp
          emptyDir: {}
        - name: varlog
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "site-monitor.selectorLabels" . | nindent 14 }}
      {{- end }}
