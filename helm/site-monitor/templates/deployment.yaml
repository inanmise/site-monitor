{{- /* OpenTelemetry Java agent via the OpenTelemetry Operator (2026-10-21) - see values.yaml config.otel.agent */ -}}
{{- $otel := .Values.config.otel | default dict -}}
{{- $agent := $otel.agent | default dict -}}
{{- if $agent.enabled -}}
{{- if $otel.endpoint -}}
{{- fail "config.otel.agent.enabled and config.otel.endpoint are mutually exclusive: with the OpenTelemetry Java agent the agent sends the traces (collector address from the Instrumentation resource). Clear config.otel.endpoint or turn config.otel.agent.enabled off." -}}
{{- end -}}
{{- if include "site-monitor.manualOtelInject" . -}}
{{- fail "podAnnotations already has instrumentation.opentelemetry.io/inject-java while config.otel.agent.enabled is true: remove it from podAnnotations (config.otel.agent.instrumentation sets it)." -}}
{{- end -}}
{{- end -}}
{{- /* Multi-pod guards (2026-10-21) - see docs/RUNBOOK.md "Çok pod" */ -}}
{{- if and (or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled) (ne (toString .Values.config.sessionStoreType) "jdbc") -}}
{{- fail (printf "config.sessionStoreType is %q but more than one pod can run (replicaCount=%v, autoscaling.enabled=%v): sessions must be shared through PostgreSQL. Set config.sessionStoreType=jdbc (the prod default) or run a single replica. With the in-memory store a login made on one pod is unknown on the other (users are logged out at random) and every pod start clears every user's single-session marker." (toString .Values.config.sessionStoreType) .Values.replicaCount .Values.autoscaling.enabled) -}}
{{- end -}}
{{- $grace := int (.Values.terminationGracePeriodSeconds | default 90) -}}
{{- $preStop := 10 -}}
{{- if hasKey .Values "preStopSleepSeconds" -}}{{- $preStop = int .Values.preStopSleepSeconds -}}{{- end -}}
{{- if lt $preStop 0 -}}
{{- fail (printf "preStopSleepSeconds must be 0 (no preStop hook) or more, got %d" $preStop) -}}
{{- end -}}
{{- if ge $preStop $grace -}}
{{- fail (printf "preStopSleepSeconds (%d) must be well below terminationGracePeriodSeconds (%d): the kubelet counts the preStop sleep inside the grace period, so the app would be SIGKILLed before its own graceful shutdown (requests, job locks, sweep-leader lease) could run. Defaults: 10 and 90." $preStop $grace) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "site-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "site-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "site-monitor.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "site-monitor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        {{- $podAnnotations := .Values.podAnnotations }}
        {{- /* an explicit opt-out "false" in podAnnotations must not render next to the agent annotation (duplicate key) */}}
        {{- if $agent.enabled }}{{- $podAnnotations = omit (.Values.podAnnotations | default dict) "instrumentation.opentelemetry.io/inject-java" }}{{- end }}
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $agent.enabled }}
        instrumentation.opentelemetry.io/inject-java: {{ $agent.instrumentation | default "true" | quote }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "site-monitor.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "site-monitor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Downward API — pod'un koştuğu worker node + pod kimliği (Tanıla'da gösterilir,
            # node'a bağlı egress/akbankpos sorununu korele etmek için).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Sürüm & Dağıtım Geçmişi (2026-09-10): pod kendi ortamını, Helm revizyonunu, imajını ve
            # config checksum'ını bilsin → deployment_history "prod, helm rev 47, yalnız config değişti"
            # diyebilir. Hepsi boş-toleranslı (uygulama env yoksa "bilinmiyor" der). NOT: .Release.Revision
            # pod şablonunda olduğu için her `helm upgrade` pod'u döndürür (checksum/config zaten yapıyor).
            - name: APP_ENVIRONMENT
              value: {{ .Values.config.environmentName | default "" | quote }}
            - name: HELM_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: HELM_RELEASE_REVISION
              value: {{ .Release.Revision | quote }}
            - name: HELM_CHART_VERSION
              value: {{ .Chart.Version | quote }}
            - name: APP_IMAGE_REF
              value: {{ include "site-monitor.image" . | quote }}
            - name: CONFIG_CHECKSUM
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['checksum/config']
            {{- if $agent.enabled }}
            # OpenTelemetry Java agent (config.otel.agent): the operator never overrides env already on the
            # container. No client spans / traceparent on checks to monitored sites, metrics stay on Prometheus,
            # Spring Boot must not map the agent's OTEL_* variables into its own exporter; log MDC keys stay traceId/spanId;
            # approval-link tokens (?token=) and other credential query parameters are redacted in url.query (the
            # setting REPLACES the agent's built-in list, so that list is repeated in site-monitor.otelSensitiveQueryParameters).
            {{- $agentEnv := dict "OTEL_SERVICE_NAME" ($agent.serviceName | default (include "site-monitor.fullname" .)) "OTEL_METRICS_EXPORTER" "none" "OTEL_INSTRUMENTATION_JAVA_HTTP_CLIENT_ENABLED" "false" "OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED" "false" "MANAGEMENT_OPENTELEMETRY_MAP_ENVIRONMENT_VARIABLES" "false" "OTEL_INSTRUMENTATION_COMMON_LOGGING_TRACE_ID_KEY" "traceId" "OTEL_INSTRUMENTATION_COMMON_LOGGING_SPAN_ID_KEY" "spanId" "OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS" (include "site-monitor.otelSensitiveQueryParameters" .) }}
            {{- with $otel.resourceAttributes }}
            {{- $_ := set $agentEnv "OTEL_RESOURCE_ATTRIBUTES" . }}
            {{- end }}
            {{- range $name, $value := mergeOverwrite $agentEnv ($agent.extraEnv | default dict) }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "site-monitor.fullname" . }}-config
            - secretRef:
                name: {{ include "site-monitor.secretName" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Spring Boot Actuator probe grupları (path'ler values.yaml .Values.probes.*).
          # startup app gerçekten hazır olunca (readiness 200) tamamlanır → readiness/liveness devralır.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: 8080
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt $preStop 0 }}
          # preStop (2026-10-21): the endpoint is removed from the Service / ingress while the pod still serves; only
          # then does SIGTERM start Spring's graceful shutdown (no 502 on in-flight POSTs during a rollout). The image
          # is alpine, so busybox sleep exists. Time budget (all inside terminationGracePeriodSeconds):
          # preStop 10 + web phase 20 + executor phase 20 + @Scheduled await 20 + @PreDestroy ~10 = 80 < 90.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $preStop }}"]
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: tmp
          emptyDir: {}
        - name: varlog
          emptyDir: {}
      # 90 s (was 60): the worst-case Spring shutdown (web phase + executor phase + @Scheduled await + @PreDestroy)
      # plus the preStop sleep must finish before SIGKILL, otherwise the sweep-leader lease is not released and the
      # other pod waits the full lease TTL (180 s) before it takes monitoring over.
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable | default "DoNotSchedule" }}
          labelSelector:
            matchLabels:
              {{- include "site-monitor.selectorLabels" . | nindent 14 }}
          {{- with .Values.topologySpreadConstraints.matchLabelKeys }}
          matchLabelKeys:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
