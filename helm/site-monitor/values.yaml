# ─────────────────────────────────────────────────────────────────────────────
# Site Monitor Helm Values
# Override with: helm install site-monitor ./helm/site-monitor -f my-values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# More than one pod (replicaCount > 1 or autoscaling.enabled) REQUIRES config.sessionStoreType=jdbc — helm template
# fails otherwise. Change the replica count in its OWN `helm upgrade` (same image), never together with a new
# version: two new-version pods would start at once. Prerequisites (egress parity per node, NTP, max_connections,
# quota) and the procedure: docs/PROD_DEPLOY_CHECKLIST.md "Çok pod" and docs/RUNBOOK.md "Çok pod".
replicaCount: 1

# Shutdown (2026-10-21). The kubelet waits terminationGracePeriodSeconds after it starts the preStop hook, then
# SIGKILLs. Budget: preStop 10 + notification-pool drain 20 (ContextClosedEvent) + Spring web phase 20 + executor
# phase 20 + @Scheduled await 20 + shared destroy-wait budget 10 (ShutdownDeadline) = 100 s < 120 s (backend application.properties:
# SHUTDOWN_PHASE_TIMEOUT / SCHEDULING_AWAIT_TERMINATION; WebConfig.NOTIFY_AWAIT_SECONDS). The sweep-leader lease is
# released at the very start of the shutdown; a pod killed early still cuts in-flight work and leaves its job locks
# to their TTL (3 min).
terminationGracePeriodSeconds: 120
# preStop "sleep N": the pod leaves the Service / ingress endpoints before Spring stops accepting requests, so a
# rollout does not answer in-flight POSTs with 502. 0 = no preStop hook. Must stay below terminationGracePeriodSeconds.
preStopSleepSeconds: 10

# Pod placement (2026-10-21). Empty = not rendered. Use nodeSelector / affinity to pin the pods to nodes whose
# egress (proxy ACL, firewall allowlists, SMTP relay, LDAP, push gateway, RDAP) is known to work — whichever pod
# holds the sweep-leader lease runs ALL monitoring, and the lease moves between nodes on every rollout.
#   nodeSelector:
#     sitemonitor-egress: "ok"
nodeSelector: {}
affinity: {}
tolerations: []
# Optional PriorityClass (2026-10-23, multi-pod release 2b): with a cluster PriorityClass above the default, a node
# under pressure evicts lower-priority workloads before SiteMonitor (the sweep-leader pod runs ALL monitoring).
# The class must exist in the cluster (`kubectl get priorityclass`). Empty = not rendered.
priorityClassName: ""

image:
  repository: ghcr.io/inanmise/site-monitor
  # Empty -> "v" + Chart.AppVersion (e.g. v20.86.0). release.yml pushes ONLY :vX.Y.Z and :latest,
  # never the bare X.Y.Z, so an explicit tag must carry the "v" too (templates/_helpers.tpl).
  # Reproducible/rollback-safe (never "latest"). develop/release overlays set their own tags.
  tag: ""
  # Optional "sha256:<64 hex>": pins the exact image content (repository:tag@digest).
  # Use it for a rollback to a known image; see docs/RUNBOOK.md -> Rollback.
  digest: ""
  pullPolicy: Always

# Registry credentials for a private registry (e.g. a private GHCR package or an internal mirror):
#   imagePullSecrets:
#     - name: ghcr-pull
# Empty = the node / ServiceAccount must already be able to pull the image.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: cert-monitor.example.com
  tls:
    enabled: true
    secretName: site-monitor-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

# Application configuration (non-sensitive)
config:
  springProfile: prod
  # Ortam etiketi (dev | staging | prod) — Sürüm & Dağıtım Geçmişi'nde dağıtım kaydına ve Nav sürüm
  # popover'ına yazılır; springProfile üç ortamda da "prod" olduğundan ortamı yalnız bu ayırt eder.
  # environments/*.yaml doldurur; boş = uygulama "bilinmiyor" der.
  environmentName: ""
  # com.sitemonitor log seviyesi. Prod'da INFO: DEBUG'ta heartbeat/sweep/per-domain satırları pod başına
  # günde on binlerce satır üretir ve prod'da hem console hem dosya appender'ına yazılır (çift I/O).
  # Restart'sız değiştirmek için: Yönetim → Genel Ayarlar → Loglama (DB override env'i ezer).
  logLevel: "INFO"
  # Log line format (2026-10-11): json (default in prod, one JSON object per line: ECS fields +
  # requestId / traceId) | text (plain "… : rid=<id> trace=<id> message"). logJsonFormat: ecs | logstash | gelf.
  logFormat: "json"
  logJsonFormat: "ecs"
  # OpenTelemetry tracing (2026-10-11). Spans are always created (traceId in every log line) but only
  # EXPORTED when endpoint is set: the FULL OTLP/HTTP traces URL of your collector, e.g.
  # http://otel-collector:4318/v1/traces.
  # samplingProbability: share of requests traced (0.0-1.0). resourceAttributes: "k=v,k2=v2" (e.g.
  # "deployment.environment=prod"). Metrics stay on Prometheus (/metrics).
  otel:
    endpoint: ""
    samplingProbability: "0.1"
    resourceAttributes: ""
    # OpenTelemetry Java agent injected by the OpenTelemetry Operator (2026-10-21) — the OTHER way to send
    # traces; use it INSTEAD of endpoint above, not with it (helm template fails when both are set). Needs the
    # operator and an Instrumentation resource in the cluster. Adds the pod annotation
    # instrumentation.opentelemetry.io/inject-java (do NOT also put it into podAnnotations — helm template
    # fails) plus container env the operator never overrides:
    #   OTEL_INSTRUMENTATION_JAVA_HTTP_CLIENT_ENABLED=false, OTEL_INSTRUMENTATION_HTTP_URL_CONNECTION_ENABLED=false
    #     — checks to MONITORED sites (HTTP/keyword/page, HSTS, OCSP/CRL, RDAP) and webhook/push calls must
    #     not carry a traceparent header nor create a client span per check;
    #   OTEL_METRICS_EXPORTER=none — metrics stay on Prometheus (/metrics);
    #   OTEL_SERVICE_NAME (serviceName, empty = the Deployment name);
    #   MANAGEMENT_OPENTELEMETRY_MAP_ENVIRONMENT_VARIABLES=false — Spring Boot must not map the agent's OTEL_*
    #     variables into its own exporter (that crashed the start with OTEL_EXPORTER_OTLP_PROTOCOL=grpc);
    #   OTEL_RESOURCE_ATTRIBUTES (resourceAttributes above, when set; the operator appends its own);
    #   OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS — server spans record url.query;
    #     the approval links' ?token= (weekly / technical-error reports, valid 14 days) must not reach the trace
    #     backend. REPLACES the agent's built-in list, so that list is repeated (_helpers.tpl).
    # An explicit podAnnotations "instrumentation.opentelemetry.io/inject-java: false" counts as not set.
    # The app detects the agent and turns its own OTLP export off (one trace system: the agent's; log trace id
    # = the agent's). Sampling, propagators and the collector address come from the Instrumentation resource;
    # samplingProbability above does not apply. The agent adds ~100-200 MiB memory and a slower start
    # (resources.limits.memory and probes.startup.failureThreshold — see docs/RUNBOOK.md "Günlükler ve izleme").
    agent:
      enabled: false
      # "<namespace>/<Instrumentation name>", just "<name>" (release namespace) or "true" (the only one there).
      instrumentation: "opentelemetry/opentelemetry-instrumentation"
      serviceName: ""
      # Default since 2026-10-23 (multi-pod release 2b): OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED=false —
      # the agent would otherwise open one span per @Scheduled tick (54 jobs, several every 5-30 s, on EVERY pod;
      # followers skip most of them) and flood the trace backend with empty "skipped" spans.
      # Extra container env for the agent; wins over the defaults above and over the Instrumentation
      # resource. e.g. OTEL_LOGS_EXPORTER: "none", OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "true" (back on).
      extraEnv: {}
  # @Scheduled havuzu (33 zamanlanmış iş; 4'ü 30 sn'lik sweep, 4'ü 10 sn'lik ayar-cache refresh).
  # Sayfa bütünlüğü kontrolü tek başına 120 sn sürebildiği için dar havuz cron işlerini geciktirir.
  schedulingPoolSize: "8"
  # External PostgreSQL connection — fill these in with real values
  dbHost: "REPLACE_DB_HOST"
  dbPort: "5432"
  dbName: certmonitor
  dbUser: certmonitor
  # Tek pod / 100 kullanıcı: 25. Bu değer POD BAŞINA; rollout'ta (maxSurge 1) replica + 1 pod birlikte koşar.
  # Kural: max_connections ≥ (replica + 1) × dbPoolMax + 25 (yedek / yönetim / izleme payı) →
  # dbPoolMax = min(30, floor((max_connections − 25) / (replica + 1))). PgBouncer yalnız SESSION kipinde
  # (advisory lock + SET lock_timeout oturum ister; transaction kipi uyumsuz). Ayrıntı: docs/db-scaling.md.
  dbPoolMax: "25"
  # Hikari minimum-idle (DB_POOL_MIN, 2026-10-23): connections each pod keeps open while idle; the pool still grows to
  # dbPoolMax under load. 5 (the application default without Helm stays 10): during a rollout replica + 1 pods hold
  # their idle connections at the same time. 0 … dbPoolMax (helm template fails when it is larger than dbPoolMax).
  dbPoolMin: "5"
  # PostgreSQL JDBC socketTimeout (sn). pgjdbc varsayılanı sınırsız: sessizce düşen bir bağlantı (NAT/LB/yük devri)
  # kullanımdaki sorguyu ve iş parçacığını sonsuza dek tutar. Cömert (30 dk) — açılış CREATE INDEX'leri kesilmesin.
  # 0 = kapalı.
  dbSocketTimeoutSeconds: "1800"
  emailEnabled: "true"
  smtpHost: smtp.gmail.com
  smtpPort: "587"
  smtpAuth: "true"
  smtpStarttlsEnable: "true"
  smtpStarttlsRequired: "true"
  smtpSslTrust: "smtp.gmail.com"
  corsAllowedOrigins: ""
  # Uygulamanın dışarı bakan adresi (mail linkleri için, ör. haftalık rapor hatırlatması).
  # Boş bırakılırsa otomatik "https://<ingress.host>" kullanılır (route ile tutarlı) —
  # genelde elle set etmeye gerek yok. Gerekirse tam URL ver: "https://cert-monitor.example.com".
  appBaseUrl: ""
  # Başarısız-login anomali uyarısı — eşikler/cooldown admin UI'dan (Ayarlar → Login Anomali) canlı
  # ayarlanır; bunlar yalnız başlangıç varsayılanı. Alıcı boşsa SYSTEM_ADMIN_EMAIL'e düşer.
  failedLoginAlertEnabled: "true"
  failedLoginAlertRecipients: ""
  # Loglardaki gerçek client IP'si için forwarding başlık sırası (ilk dolu olanın leftmost değeri).
  # Proxy/LB arkasında doğru başlık ortama göre değişir → /api/admin/client-ip-debug ile bulup
  # buraya yaz (ör. "X-Real-IP" veya "X-Forwarded-For"). Birden çok: "X-Real-IP,X-Forwarded-For".
  clientIpHeaders: "X-Forwarded-For"
  checkTimeoutSeconds: "10"
  warningDays: "30"
  parallelWorkers: "20"
  # Haftalık erişilebilirlik e-postası: sertifika sahibi takıma her Pazartesi 10:00 (Europe/Istanbul)
  # geçen haftanın domain availability özeti. Genel Ayarlar'dan da canlı aç/kapa edilebilir.
  weeklyAvailEnabled: "true"
  weeklyAvailCron: "0 0 10 ? * MON"
  # Sertifika tarama executor'ı (paralel kontrol thread'leri). CPU-sınırlı küçük
  # ortamlarda düşür → açılışta CPU oversubscription olmasın.
  # Tek pod: sweep TLS/OCSP kriptosu kullanıcı istekleriyle aynı çekirdekleri paylaşır; CallerRunsPolicy
  # sayesinde taşan iş reddedilmez, caller'da koşar → güvenli. 2026-09-10: 12/30 → 20/50 (uygulama
  # varsayılanı): işler ağ-bağımlı (soket bekleme), 50 thread ≈ 25 MB yığın (-Xss512k), CPU 2000m.
  # Kuyruk 1000 → 5000: derinlik bellek-ucuz (görev başına küçük DTO), Görev Kuyruğu kartı %80'de
  # doygunluk rozeti + caller-runs sayacı gösterir. Env: EXECUTOR_CORE_SIZE/MAX_SIZE/QUEUE_CAPACITY.
  executorCoreSize: "20"
  executorMaxSize: "50"
  executorQueueCapacity: "5000"
  # Açılışta ağır tarama + escalation catch-up bu kadar ms geciktirilir; login/BCrypt
  # ilk dakikada CPU'yu serbest bulsun (açılışta ~1dk askıda kalma fix'i).
  startupCheckDelayMs: "60000"
  # stdout/stderr UTF-8: container locale ASCII olsa bile logback dışı çıktılar da
  # (ör. System.out) Türkçe karakterleri bozmadan yazsın (mojibake savunması).
  javaOpts: "-XX:MaxRAMPercentage=75.0 -XX:MinRAMPercentage=50.0 -Xss512k -XX:+ExitOnOutOfMemoryError -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dfile.encoding=UTF-8 -Djdk.httpclient.allowRestrictedHeaders=host"

  # Spring Session storage → site.monitor.session.store (SPRING_SESSION_STORE_TYPE).
  # "jdbc" (default) persists sessions to spring_session / spring_session_attributes so users
  # stay logged in across pod restarts and replicas share sessions. "memory" (or "none") is the
  # in-memory fallback — sessions are lost on restart. 2026-10-09: before this fix Spring Boot 4
  # ignored the setting (missing spring-boot-session-jdbc), so prod ran in-memory since 2026-06-17.
  sessionStoreType: "jdbc"

  # ── Egress proxy (corporate forward proxy) ────────────────────────────────
  # Empty defaults preserve direct-connection behavior. Fill these in on
  # environments where outbound TLS handshakes (and OCSP/CRL) must traverse a
  # corporate forward proxy. Driven from observed prod symptoms: external
  # akbank domains were RST-ing because the pod had no proxy configured.
  httpProxyHost: ""        # e.g. "proxy.corp.local"
  httpProxyPort: "0"       # e.g. "8080"
  # Comma-separated suffix list. Suffix match: ".corp.com" covers *.corp.com.
  # Internal domains served by private routing should appear here so they
  # don't get tunneled through the proxy unnecessarily.
  noProxy: ""              # e.g. ".corp.com,.corp.local,10.0.0.0/8"

  # ── Domain-expiry WHOIS ───────────────────────────────────────────────────
  # RDAP (443, proxy-aware) is the primary domain-expiry source. Raw port-43
  # WHOIS can't traverse a 443/80-only egress proxy, so behind a corporate proxy
  # it only wastes ~6s per domain before timing out → default off here. RDAP-only
  # is sufficient; still live-toggleable from Genel Ayarlar (site.monitor.domain.whois-enabled).
  whoisEnabled: "false"

  # ── Critical-domain second daily check ────────────────────────────────────
  # Re-checks ONLY active domains whose last check days_remaining ≤ threshold, at a
  # separate daily slot (Europe/Istanbul) using a dedicated scheduler_lock key. Purpose:
  # a same-day renewal auto-closes its open DOMAINMON_EXPIRY alarm without waiting for
  # tomorrow's sweep. Daily re-alert dedupe is preserved → produces NO extra notification.
  domainCriticalCheckEnabled: "true"
  domainCriticalCheckCron: "0 0 16 * * *"
  domainCriticalCheckThresholdDays: "7"

  # ── Corporate SSL-inspection CA bundle ────────────────────────────────────
  # PEM (root + intermediate certs) of the forward proxy's MITM re-signing CA.
  # TrustEvaluator adds these as trust anchors ALONGSIDE the JVM cacerts (never
  # trust-all), so outbound RDAP/HTTPS through an SSL-inspecting proxy validates
  # via PKIX instead of failing "unable to find valid certification path".
  # Empty = public CAs only. Genel Ayarlar (site.monitor.trust.ca-bundle-pem)
  # can override live. To rotate: capture the new chain
  #   openssl s_client -connect data.iana.org:443 -proxy <proxy:port> -showcerts
  # paste the PEM below (as a multiline block) and `helm upgrade`. See docs/RUNBOOK.md.
  caBundlePem: ""
  #   caBundlePem: |
  #     -----BEGIN CERTIFICATE-----
  #     ...corporate root CA...
  #     -----END CERTIFICATE-----

  # ── Extra environment (2026-10-23, multi-pod release 2b) ─────────────────
  # NON-secret application keys the chart has no value for (any application.properties ${ENV_VAR}), rendered into
  # the ConfigMap, e.g.
  #   extraEnv:
  #     TOMCAT_MAX_THREADS: "200"
  #     SITE_MONITOR_TRACING_DEFER_TO_AGENT: "true"
  # Names: [A-Za-z_][A-Za-z0-9_]*, values: plain scalars. helm template FAILS for a name the chart already sets
  # (ConfigMap, Secret, container env) — change that value through its own key instead; secrets never go here
  # (ConfigMaps are readable by everyone with namespace read access) — use secret.* / existingSecret. Agent env:
  # config.otel.agent.extraEnv.
  extraEnv: {}

# Sensitive values — provide via --set or external secret manager
# Do NOT commit real values here
#
# WARNING (prod gate P3-1): when existingSecret is EMPTY, every `helm upgrade` re-renders the
# chart Secret from the values below and OVERWRITES the live Secret. "helm.sh/resource-policy: keep"
# only prevents deletion, not this overwrite. Any key you do not pass falls back to the placeholder
# here: REPLACE_ME passwords, the sample mailbox, an empty secretKey, empty proxy credentials.
# Effects: empty secretKey -> prod refuses to start; wrong DB password -> no DB; placeholder SMTP
# password / empty proxy credentials -> the pod starts but mail / RDAP fail SILENTLY; a different
# adminUsername moves the bootstrap-admin identity. PROD: set existingSecret (docs/PROD_DEPLOY_CHECKLIST.md).
secret:
  # If existingSecret is set, an existing K8s Secret is used instead of creating one.
  # It must hold: ADMIN_USERNAME, ADMIN_PASSWORD, DB_PASSWORD, SPRING_MAIL_USERNAME,
  # SPRING_MAIL_PASSWORD, SITE_MONITOR_EMAIL_FROM, SITE_MONITOR_SECRET_KEY, HTTP_PROXY_USER,
  # HTTP_PROXY_PASS (+ optional SITE_MONITOR_SECRET_KEY_PREVIOUS while rotating, + optional
  # METRICS_EXPORT_TOKEN for the Grafana business metrics endpoint). With existingSecret the pod is NOT restarted by a Secret edit (no checksum):
  # run `kubectl rollout restart deploy/<name>` after changing it.
  existingSecret: ""
  adminUsername: "admin"
  adminPassword: "REPLACE_ME"
  dbPassword: "REPLACE_ME"
  smtpUser: "certmonitor01@gmail.com"
  smtpPassword: "REPLACE_WITH_GMAIL_APP_PASSWORD"
  emailFrom: "certmonitor01@gmail.com"

  # Symmetric key (AES-GCM) for secrets saved from the UI: LDAP bind password, SMTP
  # password, HTTP/Keyword header secrets, personal-push header secrets, PageSpeed API
  # key, scripted-check env secrets. MUST stay the SAME across pods, restarts and
  # upgrades. With the prod profile an empty value stops the app at startup (fail-fast);
  # only non-prod profiles fall back to the built-in dev key.
  #
  # NEVER CHANGE THE VALUE OF AN EXISTING INSTALLATION. A new key does not fail loudly:
  # every stored secret decrypts to null ("SecretCipher: decrypt failed" WARN) -> LDAP
  # logins, alert mail, header-secret monitors, push, PageSpeed and scripted checks break.
  # To change it, ROTATE instead (2026-10-11, docs/RUNBOOK.md "Anahtar döndürme"): new key in
  # secretKey, old key in secretKeyPrevious, deploy, Settings > Secret tools > Re-encrypt, then
  # empty secretKeyPrevious and deploy again.
  # Carry the CURRENT value over unchanged (preferably via existingSecret).
  secretKey: ""   # new install only: >=32 random chars; existing install: the CURRENT value
  #   Yer tutucu bir DIZE BIRAKILAMAZ: SecretCipher fail-fast'i yalnizca "bos ya da
  #   gomulu dev anahtari" durumunu yakalar, dolayisiyla "REPLACE_WITH_..." gibi bir
  #   metin kapidan GECIYOR ve LDAP/SMTP secret'lari git'te duran bir anahtarla
  #   sifreleniyordu (UI ise secret_key_set: true diyordu). Bos birakilirsa prod
  #   profilinde uygulama ACILMAZ — istenen davranis budur.

  # Previous key, DECRYPT ONLY (key rotation, 2026-10-11). Empty = no rotation in progress (the
  # Secret key is then omitted). Set it to the OLD key while rotating; remove it once Settings >
  # Secret tools > Key rotation shows "All values are on the current key".
  secretKeyPrevious: ""

  # Bearer token of the business metrics endpoint /metrics/sitemonitor (Grafana dashboard, 2026-10-18).
  # Empty (default) or shorter than 32 characters -> the endpoint answers 404 and the exporter does
  # not run; /metrics keeps serving only JVM / HTTP / app health metrics. Set >= 32 random chars
  # (e.g. `openssl rand -hex 32`) to enable it, give the SAME value to Prometheus (scrape job "authorization: credentials_file") and
  # NEVER commit it. Anyone holding it reads the whole monitoring inventory (monitor names,
  # targets, teams, certificates, open alerts) — treat it like a password. Rotate: new value here +
  # in Prometheus, deploy; old scrapes get 401 until Prometheus is updated. With existingSecret, editing
  # the Secret in place does NOT restart the pods: run `kubectl rollout restart deploy/<name>` — until
  # then the old (possibly leaked) token keeps working. `helm upgrade` with a changed value restarts them.
  metricsExportToken: ""

  # Corporate proxy auth (Basic). Leave empty for anonymous proxies.
  # Inject real values via --set or external-secrets; do NOT commit them.
  httpProxyUser: ""
  httpProxyPass: ""

# Tek pod, 100 kullanıcı + 200-1000 domain: dikey kapasite tek ölçekleme kaynağı (yatay yok).
# CPU 2→4 çekirdek (BCrypt/TLS + scheduler + istek işleme aynı pod'da), RAM 1.5→3Gi (heap ~2.3Gi:
# eşzamanlılık + cache + büyük-okuma tamponları; OOM=tam kesinti). request'ler garanti kapasite için
# yükseltildi (eski 512Mi/500m node over-commit + CFS throttling'e açıktı).
# AKSİYON: node'un bu pod'a 4 CPU / 3Gi verebildiğini doğrula.
# Senaryo İzleme (10. tür): her kontrolde kısa ömürlü k6 alt süreci JVM RSS'inin ÜSTÜNE bellek ekler
# (havuz varsayılan 2 eşzamanlı × ~50-150Mi). Bu yük için memory limit 3Gi→3.5Gi, request 1.5→1.75Gi yükseltildi.
# ephemeral-storage (2026-10-23, multi-pod release 2b): the root FS is read-only, so the pod's node disk use is the
# /var/log and /tmp emptyDirs (storage.* below) + the container's stdout log. The request lets the scheduler place the
# pod on a node with room; above the limit the kubelet EVICTS the pod (a runaway log or temp file never fills the
# node). logback keeps ≤ ~1.25 GB in /var/log (archives 500 + 200 + 500 MB + current files). The namespace
# ResourceQuota / LimitRange must admit these values (twice during a rollout). The environment files override only
# cpu / memory; these keys come from here.
resources:
  requests:
    memory: "1792Mi"
    cpu: "1500m"
    ephemeral-storage: "1Gi"
  limits:
    memory: "3584Mi"
    cpu: "4000m"
    ephemeral-storage: "4Gi"

# Writable pod volumes (the root FS is read-only). sizeLimit: the kubelet evicts the pod when the volume grows past it.
#   varLogSizeLimit — /var/log (logback files, ≤ ~1.25 GB by its own caps); empty = no limit.
#   tmpSizeLimit    — /tmp (k6 scripts, upload / PDF buffers, JVM temp); empty = no limit (default — a too small
#                     value would evict the pod in the middle of a k6 run).
storage:
  varLogSizeLimit: "2Gi"
  tmpSizeLimit: ""

# Kubernetes/OpenShift sağlık probe'ları — Spring Boot Actuator grupları:
#   /health/readiness → readinessState (warmup boyunca uygulama REFUSING_TRAFFIC ile gate eder →
#                       pod, senkron bootstrap bitene kadar Service endpoint'lerine eklenmez → ilk
#                       tıklama soğuk instance'a düşmez/askıda kalmaz)
#   /health/liveness  → livenessState (DB sağlığından bağımsız → DB blip'i gereksiz pod restart'ı tetiklemez)
# startupProbe readiness grubuna bakar → app GERÇEKTEN hazır olunca tamamlanır; sonra liveness/readiness devralır.
probes:
  startup:
    path: /health/readiness
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30        # ~300s bootstrap bütçesi (büyük tablolarda şema patch dahil); aşılırsa pod öldürülür
  readiness:
    path: /health/readiness
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health/liveness
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6         # cömert → geçici yavaşlık restart etmesin

# HorizontalPodAutoscaler — OFF in every environment (multi-pod releases 1-2b): ALL monitoring runs on the
# sweep-leader pod, so extra pods add HA and UI / API capacity but no monitoring throughput; a scale-in can remove
# the leader at any moment (handover + in-memory alarm state reset). Scale the leader vertically (resources).
# If it is ever turned on (2026-10-23 chart fixes):
#   - the Deployment carries NO `replicas:` (the HPA owns the count; a `helm upgrade` no longer resets it). The FIRST
#     upgrade that turns the HPA on removes the field, and Kubernetes falls back to 1 replica until the HPA's first sync
#     (≈ 15 s) — do it outside business hours, with minReplicas ≥ 2;
#   - each metric is rendered only when its target is set; the memory target is EMPTY by default: a JVM heap is sized
#     to the limit and never shrinks, so a memory metric pins the HPA at maxReplicas;
#   - behavior: scale down at most 1 pod per 5 min after a 10 min quiet window, scale up at most 1 pod per 2 min.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # empty = no memory metric (see above). A number (e.g. 80) adds it.
  targetMemoryUtilizationPercentage: ""
  # autoscaling/v2 HorizontalPodAutoscalerBehavior, rendered as given ({} = Kubernetes defaults).
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleUp:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

# PodDisruptionBudget — set EXACTLY ONE of minAvailable / maxUnavailable (helm template fails with both or neither;
# clear the default with `minAvailable: null` when you use maxUnavailable). helm template also fails when an integer
# minAvailable ≥ replicaCount (HPA on: ≥ autoscaling.minReplicas), a "100%" minAvailable, or a maxUnavailable of 0 /
# "0%": such a PDB never allows a voluntary eviction, so a node drain / cluster upgrade blocks forever.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  # Ping monitor (ICMP) için non-root unprivileged ICMP soketi. K8s "safe" sysctl —
  # CAP_NET_RAW gerektirmez. fsGroup (1000) ping_group_range içinde olunca iputils
  # ping non-root çalışır. Cluster PodSecurity policy'si safe sysctl'lere izin
  # vermiyorsa bu blok kaldırılabilir (ping monitor o zaman zarifçe N/A döner).
  sysctls:
    - name: net.ipv4.ping_group_range
      value: "0 2147483647"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Node affinity / spread
# Enable for more than one pod only when the cluster has at least replicas + 1 schedulable nodes: with
# DoNotSchedule and too few nodes the rollout's surge pod stays Pending and `--atomic` rolls back. Fewer nodes ->
# whenUnsatisfiable: ScheduleAnyway. matchLabelKeys: ["pod-template-hash"] (Kubernetes >= 1.27) counts only the
# pods of the SAME ReplicaSet, so the old pods of a rollout do not skew the placement of the new ones (without it
# both new pods can end up on one node after the rollout). Empty = not rendered.
topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys: []
  # Optional SECOND constraint across zones (2026-10-23, multi-pod release 2b) — independent of `enabled` above, same
  # pod selector and matchLabelKeys. ScheduleAnyway (default) is a preference: it never keeps a rollout's surge pod
  # Pending in a single-zone cluster. The topologyKey label must be on the nodes (`kubectl get nodes -L <key>`).
  zone:
    enabled: false
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL subchart (Bitnami) — disabled by default
# When enabled=true, the chart deploys a bundled PostgreSQL instance.
# DB_HOST, DB_NAME, DB_USER are auto-resolved; set auth.password below.
# When enabled=false (default), configure external DB via config.dbHost etc.
# ─────────────────────────────────────────────────────────────────────────────
postgresql:
  enabled: false
  auth:
    database: certmonitor
    username: certmonitor
    password: ""  # required when postgresql.enabled=true
  primary:
    persistence:
      enabled: true
      size: 8Gi
    # DB-geneli SQL istatistikleri (Sistem Sağlığı → Veritabanı analitiği) için pg_stat_statements.
    # shared_preload_libraries restart gerektirir; uygulama açılışta CREATE EXTENSION'ı best-effort dener.
    # Bu eklenti yoksa analitik, sql_query_history (Playground) fallback'ine düşer.
    extendedConfiguration: |
      shared_preload_libraries = 'pg_stat_statements'
      pg_stat_statements.track = top
