name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Compute next version ─────────────────────────────────────────────
      - name: Compute next version
        id: ver
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=${CURRENT}"   >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}"         >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"         >> "$GITHUB_OUTPUT"
          echo "prev_tag=v${CURRENT}" >> "$GITHUB_OUTPUT"

      # ── 2. Bump VERSION + Chart.yaml ────────────────────────────────────────
      - name: Bump version files
        run: |
          echo "${{ steps.ver.outputs.next }}" > VERSION
          sed -i "s/^version: .*/version: ${{ steps.ver.outputs.next }}/"            helm/cert-monitor/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.ver.outputs.next }}\"/" helm/cert-monitor/Chart.yaml

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add VERSION helm/cert-monitor/Chart.yaml
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.next }} [skip ci]"

      # ── 3. Generate changelog ───────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV="${{ steps.ver.outputs.prev_tag }}"
          if git rev-parse "$PREV" >/dev/null 2>&1; then
            LOG=$(git log "${PREV}..HEAD" --pretty=format:"- %s" --no-merges | grep -v '\[skip ci\]' || true)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges | grep -v '\[skip ci\]' || true)
          fi
          if [ -z "$LOG" ]; then
            LOG="- chore: maintenance release"
          fi
          {
            echo "log<<ENDOFLOG"
            echo "$LOG"
            echo "ENDOFLOG"
          } >> "$GITHUB_OUTPUT"

      # ── 4. Docker — build & push ────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push — master (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/inanmise/certmonitor:${{ steps.ver.outputs.tag }}
            ghcr.io/inanmise/certmonitor:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.next }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Helm chart — package & push OCI ─────────────────────────────────
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: helm package helm/cert-monitor

      - name: Push Helm chart to GHCR OCI
        run: |
          helm push certmonitor-chart-${{ steps.ver.outputs.next }}.tgz oci://ghcr.io/inanmise

      # ── 6. Tag & push ───────────────────────────────────────────────────────
      - name: Create and push git tag
        run: |
          git tag -a "${{ steps.ver.outputs.tag }}" \
            -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin master --follow-tags

      # ── 7. Back-merge master → develop ─────────────────────────────────────
      - name: Back-merge into develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-ff origin/master \
            -m "chore(release): back-merge master after ${{ steps.ver.outputs.next }} [skip ci]"
          git push origin develop

      # ── 8. GitHub Release ───────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## Installation

            **Helm:**
            ```sh
            helm install certmonitor oci://ghcr.io/inanmise/certmonitor-chart --version ${{ steps.ver.outputs.next }}
            ```

            **Docker:**
            ```sh
            docker pull ghcr.io/inanmise/certmonitor:${{ steps.ver.outputs.tag }}
            ```

            ## What's Changed

            ${{ steps.changelog.outputs.log }}

            **Full Changelog**: https://github.com/inanmise/certmonitor/compare/${{ steps.ver.outputs.prev_tag }}...${{ steps.ver.outputs.tag }}

      # ── 9. Job summary ──────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## Released ${{ steps.ver.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker | \`ghcr.io/inanmise/certmonitor:${{ steps.ver.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Helm chart | \`oci://ghcr.io/inanmise/certmonitor-chart:${{ steps.ver.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Git tag | \`${{ steps.ver.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Helm install" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "helm install certmonitor oci://ghcr.io/inanmise/certmonitor-chart --version ${{ steps.ver.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
