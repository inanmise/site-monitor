name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Sürüm artış tipi (auto = commit mesajından belirle)"
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

# ── Job 0: CI kapısı — "CI — Build & Test" yeşil olmadan sürüm çıkmaz ────────
#
# Neden ayrı bir job ve neden `gh api` ile bekleme?
#   `needs:` YALNIZ aynı workflow içindeki job'lar arasında çalışır; ci.yml ayrı bir dosya
#   olduğu için ona doğrudan bağlanılamaz. Bu push, release.yml ile ci.yml'i AYNI ANDA
#   tetikler; burada o çalışmayı commit SHA'sıyla bulup bitmesini bekliyoruz.
#
# Bu kapı olmadan ne oluyordu: v20.10.1, .2 ve .3 kırmızı CI'a rağmen tag'lendi, Docker
# image'ı ve Helm chart'ı yayınlandı (2026-08-09/10). Kırılan yalnız bir testin kendisiydi,
# ama gerçek bir regresyon da tam olarak aynı yoldan geçerdi.
jobs:
  gate:
    name: Require CI green
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.wait.outputs.proceed }}

    steps:
      - name: Wait for "CI — Build & Test" on this commit
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Yalnız `gh api --jq` kullanılır (gh'nin gömülü jq'su); harici `jq` binary'sine
          # bağımlılık yok. Çıktı tek satır: "<id> <url>", bulunamazsa boş.
          latest_run_for_sha() {
            gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | last as $r
                    | if $r then "\($r.id) \($r.html_url)" else empty end'
          }

          # 1) Çalışmanın görünmesini bekle (push'ta saniyeler içinde oluşur).
          RUN=""
          for i in $(seq 1 18); do            # 18 x 10 sn = 3 dk
            RUN="$(latest_run_for_sha || true)"
            [ -n "$RUN" ] && break
            echo "CI çalışması henüz görünmedi (${i}/18)…"
            sleep 10
          done

          # 2) Bulunamadıysa: push'ta bu bir hatadır. workflow_dispatch'te ise main'in ucu
          #    bir 'chore(release)' sürüm-artırma commit'i olabilir; o commit skip-ci
          #    belirteci taşıdığı için CI hiç koşmaz. Bu durumda main'deki EN SON
          #    tamamlanmış CI çalışmasına bakılır — yayınlanacak kod zaten odur.
          #
          #    DİKKAT: skip-ci belirteci commit mesajının GÖVDESİNDE geçse bile GitHub
          #    o push'un TÜM workflow'larını atlar. Bu yüzden burada ve commit
          #    mesajlarında belirteç literal olarak yazılmaz (2026-08-10'da yazıldı ve
          #    ne CI ne Release tetiklendi).
          if [ -z "$RUN" ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "Bu SHA için CI çalışması yok; main'deki son tamamlanmış CI'a bakılıyor."
              RUN="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=1" \
                       --jq '.workflow_runs[0] as $r
                             | if $r then "\($r.id) \($r.html_url)" else empty end')"
            fi
          fi
          if [ -z "$RUN" ]; then
            echo "::error::Bu commit için 'CI — Build & Test' çalışması bulunamadı — sürüm durduruldu."
            exit 1
          fi

          read -r RUN_ID RUN_URL <<<"$RUN"
          echo "İzlenen CI çalışması: ${RUN_URL}"

          # 3) Bitmesini bekle.
          STATUS=""; CONCLUSION=""
          for i in $(seq 1 240); do           # 240 x 10 sn = 40 dk (job timeout 45 dk)
            read -r STATUS CONCLUSION <<<"$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" \
              --jq '"\(.status) \(.conclusion // "-")"')"
            [ "$STATUS" = "completed" ] && break
            echo "CI durumu: ${STATUS} (${i}/240)…"
            sleep 10
          done

          if [ "$STATUS" != "completed" ]; then
            echo "::error::CI 40 dakikada bitmedi — sürüm durduruldu: ${RUN_URL}"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI yeşil değil (${CONCLUSION}) — sürüm durduruldu: ${RUN_URL}"
            exit 1
          fi

          # 4) Beklerken main ilerledi mi? Aşağıdaki job'lar `ref: main` ile checkout ediyor;
          #    ilerlemişse CI'ın doğruladığı SHA ile yayınlanacak kod ayrışır. Bu yarış kapı
          #    eklenmeden de vardı (tetikleme ile checkout arası), ama bekleme onu saniyelerden
          #    dakikalara çıkarıyor — o yüzden burada kapatılıyor.
          #    Bu bir HATA değil, atlama: yeni push'un kendi release çalışması sırada bekliyor
          #    ve doğru SHA ile yayınlayacak. Kırmızı CI (yukarıda) gürültülü şekilde FAIL eder,
          #    bu durum ise sessizce atlanır.
          TIP="$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')"
          if [ "$TIP" != "$SHA" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main ilerledi (${SHA} → ${TIP}); bu çalışma sürüm çıkarmayacak — sıradaki push kendi sürümünü çıkarır."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "CI yeşil ve main hâlâ ${SHA} — sürüme devam."

# ── Job 1: Commit mesajlarından bump tipini belirle ──────────────────────────
  detect:
    name: Detect version bump
    needs: gate
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && needs.gate.outputs.proceed == 'true'
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      bump: ${{ steps.detect.outputs.bump }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Detect bump type from commits
        id: detect
        run: |
          # Manuel override (workflow_dispatch ile auto dışında bir şey seçildiyse)
          MANUAL="${{ inputs.bump }}"
          if [ -n "$MANUAL" ] && [ "$MANUAL" != "auto" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=${MANUAL}"      >> "$GITHUB_OUTPUT"
            echo "Manual bump: ${MANUAL}"
            exit 0
          fi

          # Son tag'den bu yana commit'leri al
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s%n%b" --no-merges)
            SUBJECTS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"%s%n%b" --no-merges)
            SUBJECTS=$(git log --pretty=format:"%s" --no-merges)
          fi

          echo "Commits since ${PREV_TAG:-beginning}:"
          echo "$COMMITS"
          echo "---"

          # Release/CI-only commit'lerini ele. Karar YALNIZ commit BAŞLIKLARINDAN
          # ($SUBJECTS) verilir — çok satırlı gövde ci:/docs: skip'ini bozmasın diye
          # %b dahil EDİLMEZ. (BREAKING CHANGE taraması aşağıda gövdeyi kullanır.)
          MEANINGFUL=$(echo "$SUBJECTS" | grep -vE '^\s*$|^chore\(release\)|^\[skip ci\]|^ci(\([^)]*\))?:' || true)
          if [ -z "$MEANINGFUL" ]; then
            echo "No meaningful commits — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "bump=none"            >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bump tipini belirle (en yüksek öncelikli kural kazanır)
          # major: BREAKING CHANGE (gövde/footer) veya ! ile işaretlenmiş başlık
          # minor: feat: / feat(scope): (başlık)
          # patch: fix:, chore:, docs:, refactor:, perf:, test:, style:, ci:, build:
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "BREAKING[- ]CHANGE" || echo "$SUBJECTS" | grep -qE "^[a-z]+(\([^)]*\))?!:"; then
            BUMP="major"
          elif echo "$SUBJECTS" | grep -qE "^feat(\([^)]*\))?:"; then
            BUMP="minor"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}"        >> "$GITHUB_OUTPUT"
          echo "Detected bump: ${BUMP}"

  # ── Job 2: Release ──────────────────────────────────────────────────────────
  release:
    name: Release (${{ needs.detect.outputs.bump }})
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Compute next version ───────────────────────────────────────────
      - name: Compute next version
        id: ver
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ needs.detect.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=${CURRENT}"   >> "$GITHUB_OUTPUT"
          echo "next=${NEXT}"         >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"         >> "$GITHUB_OUTPUT"
          echo "prev_tag=v${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT} (${CURRENT} + ${{ needs.detect.outputs.bump }})"

      # ── 2. Bump VERSION + Chart.yaml ─────────────────────────────────────
      - name: Bump version files
        run: |
          echo "${{ steps.ver.outputs.next }}" > VERSION
          sed -i "s/^version: .*/version: ${{ steps.ver.outputs.next }}/"            helm/site-monitor/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.ver.outputs.next }}\"/" helm/site-monitor/Chart.yaml

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add VERSION helm/site-monitor/Chart.yaml
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.next }} [skip ci]"

      # ── 3. Changelog ─────────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          PREV="${{ steps.ver.outputs.prev_tag }}"
          if git rev-parse "$PREV" >/dev/null 2>&1; then
            LOG=$(git log "${PREV}..HEAD" --pretty=format:"- %s" --no-merges \
              | grep -v '\[skip ci\]' | grep -v 'chore(release)' || true)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges \
              | grep -v '\[skip ci\]' | grep -v 'chore(release)' || true)
          fi
          [ -z "$LOG" ] && LOG="- chore: maintenance release"
          {
            echo "log<<ENDOFLOG"
            echo "$LOG"
            echo "ENDOFLOG"
          } >> "$GITHUB_OUTPUT"

      # ── 4. Docker build & push ───────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/site-monitor:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/site-monitor:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.next }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Security: container image vulnerability scan ──
      # docker-build.yml main'den çıkarıldığı için Trivy taraması burada (release imajı üstünde).
      # Non-blocking (exit-code 0) — baseline temizlenince '1'e çek.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/site-monitor:${{ steps.ver.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      # ── 5. Helm OCI push ─────────────────────────────────────────────────
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.14.0

      - name: Update Helm dependencies
        run: helm dep update helm/site-monitor

      - name: Package and push Helm chart
        run: |
          helm package helm/site-monitor
          helm push sitemonitor-chart-${{ steps.ver.outputs.next }}.tgz oci://ghcr.io/${{ github.repository_owner }}

      # ── 6. Tag & push to main ────────────────────────────────────────────
      - name: Create and push git tag
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — deleting and recreating"
            git tag -d "${{ steps.ver.outputs.tag }}" || true
            git push origin --delete "${{ steps.ver.outputs.tag }}" || true
          fi
          git tag -a "${{ steps.ver.outputs.tag }}" \
            -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin main --follow-tags

      # ── 7. Back-merge main → develop ─────────────────────────────────────
      - name: Back-merge into develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge --no-ff origin/main \
            -m "chore(release): back-merge main after ${{ steps.ver.outputs.next }} [skip ci]"
          git push origin develop

      # ── 8. GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## Installation

            **Helm:**
            ```sh
            helm install sitemonitor oci://ghcr.io/${{ github.repository_owner }}/sitemonitor-chart --version ${{ steps.ver.outputs.next }}
            ```

            **Docker:**
            ```sh
            docker pull ghcr.io/${{ github.repository_owner }}/site-monitor:${{ steps.ver.outputs.tag }}
            ```

            ## What's Changed

            ${{ steps.changelog.outputs.log }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.ver.outputs.prev_tag }}...${{ steps.ver.outputs.tag }}

      # ── 9. Summary ───────────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "## Released ${{ steps.ver.outputs.tag }} (${{ needs.detect.outputs.bump }} bump)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker | \`ghcr.io/${{ github.repository_owner }}/site-monitor:${{ steps.ver.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Helm | \`oci://ghcr.io/${{ github.repository_owner }}/sitemonitor-chart:${{ steps.ver.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bump type | \`${{ needs.detect.outputs.bump }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Helm install" >> "$GITHUB_STEP_SUMMARY"
          echo '```sh' >> "$GITHUB_STEP_SUMMARY"
          echo "helm install sitemonitor oci://ghcr.io/${{ github.repository_owner }}/sitemonitor-chart --version ${{ steps.ver.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
