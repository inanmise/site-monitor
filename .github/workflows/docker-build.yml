name: Docker — Build & Push

on:
  push:
    branches:
      # main'de imaj Release workflow'u tarafından (yeni sürüm tag'i + latest) build/push
      # edilir — burada tekrar etmemek için main hariç. develop/release'te Release yok.
      - develop
      - "release/**"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: site-monitor
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  docker:
    name: Build image (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Sonsuz bekleme savunması (2026-10-09): takılan bir adım işi GitHub'ın 6 saatlik sınırına dek tutmasın.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # required for ghcr.io push
    # image-boot-test işi tam olarak bu push'un birincil etiketini (image çıktısı) çeker ve açar.
    outputs:
      primary: ${{ steps.tags.outputs.primary }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
      # true = imaj itildi; Trivy kapısı işi kırmızı yapsa da açılış testi yine bu imajı açar (aşağıda `if`).
      pushed: ${{ steps.build.outputs.digest != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE="${{ env.IMAGE_NAME }}"
          # Güvenlik (CWE-94): attacker-influenceable metadata'yı run: içine GHA-expression ile GÖMME;
          # GitHub'ın built-in env değişkenlerini kullan (shell'e enjekte edilmez).
          GIT_SHA="$GITHUB_SHA"
          SHORT_SHA="${GIT_SHA:0:7}"
          BRANCH="$GITHUB_REF_NAME"

          # PREV: o ortamın şu an dağıtılmış imajının hareketli etiketi (bu push onu ezmeden ÖNCE okunur) — yeni imaj
          # onun sayfa dosyalarını da taşır (2026-10-23, çok pod R2b · MP-47; Dockerfile "previous-release").
          case "$BRANCH" in
            main)
              TAGS="${REGISTRY}/${IMAGE}:${VERSION},${REGISTRY}/${IMAGE}:latest"
              PRIMARY="${VERSION}"
              ENV_VALUES="helm/site-monitor/environments/master.yaml"
              PREV="${REGISTRY}/${IMAGE}:latest"
              ;;
            release/*)
              TAGS="${REGISTRY}/${IMAGE}:${VERSION}-rc,${REGISTRY}/${IMAGE}:staging"
              PRIMARY="${VERSION}-rc"
              ENV_VALUES="helm/site-monitor/environments/release.yaml"
              PREV="${REGISTRY}/${IMAGE}:staging"
              ;;
            develop)
              TAGS="${REGISTRY}/${IMAGE}:develop-${SHORT_SHA},${REGISTRY}/${IMAGE}:develop"
              PRIMARY="develop-${SHORT_SHA}"
              ENV_VALUES="helm/site-monitor/environments/develop.yaml"
              PREV="${REGISTRY}/${IMAGE}:develop"
              ;;
            *)
              SAFE=$(echo "$BRANCH" | tr '/' '-' | tr -cd '[:alnum:]-')
              TAGS="${REGISTRY}/${IMAGE}:${SAFE}-${SHORT_SHA}"
              PRIMARY="${SAFE}-${SHORT_SHA}"
              ENV_VALUES=""
              PREV=""
              ;;
          esac

          echo "tags=${TAGS}"             >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}"       >> "$GITHUB_OUTPUT"
          echo "env_values=${ENV_VALUES}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "prev_ref=${PREV}"         >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Önceki imaj (MP-47): özete sabitlenir; yoksa boş → sayfa dosyası taşımadan bugünkü derleme.
      - name: Resolve previous image
        id: prev
        env:
          PREV_REF: ${{ steps.tags.outputs.prev_ref }}
        run: echo "image=$(bash scripts/resolve-previous-image.sh "$PREV_REF")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            APK_REFRESH=${{ github.event.head_commit.timestamp }}-${{ github.run_id }}
            GIT_COMMIT=${{ steps.tags.outputs.short_sha }}
            PREVIOUS_IMAGE=${{ steps.prev.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Security: container image vulnerability scan (2026-11-16: KAPI) ──
      # HIGH/CRITICAL (düzeltmesi olan) bulguda iş KIRMIZI olur — release.yml'deki yayın kapısıyla aynı kural ve aynı
      # istisna dosyası (.trivyignore.yaml: yol kapsamlı, son tarihli). Bu dalların imajı zaten itilmiştir; amaç main'e
      # gelmeden önce görmek. Adım continue-on-error: özet yine yazılır, iş sonda "Trivy gate" ile kırmızıya döner.
      # 2026-11-17: exit-code 0 + JSON — bulgu kararını "Trivy gate" (scripts/trivy-gate.mjs) verir; bu adım BAŞARISIZSA
      # Trivy'nin KENDİSİ çalışamamıştır (veritabanı / zaman aşımı / imaj) ve kapı bunu bulgudan ayrı anlatır.
      - name: Trivy image scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-results.json
          trivyignores: .trivyignore.yaml

      - name: Image summary
        run: |
          echo "## Docker image built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Primary tag | \`${{ steps.tags.outputs.primary }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| All tags | \`${{ steps.tags.outputs.tags }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.tags.outputs.env_values }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Helm deploy command" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "helm upgrade --install site-monitor ./helm/site-monitor \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  -f helm/site-monitor/values.yaml \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  -f ${{ steps.tags.outputs.env_values }} \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --set image.tag=${{ steps.tags.outputs.primary }} \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  -n site-monitor --create-namespace" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node 26
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Bulgu → "düzeltmesi olan HIGH/CRITICAL bulgu" + tablo; Trivy'nin kendi hatası → "tarama çalışamadı (bulgu değil)".
      # İkisi de işi kırmızı yapar; temizse geçer.
      - name: Trivy gate
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.trivy.outcome }}
        run: node scripts/trivy-gate.mjs --report trivy-results.json --outcome "$OUTCOME" --context branch

  # İmaj açılış testi (2026-10-02, onaylı öneri 28) — adımlar ortak image-boot-test.yml'de (release.yml de çağırır).
  # Bu workflow sürüm kapısı DEĞİL; iş imaj itildikten sonra koşar ve hiçbir yayını bloklamaz. İmaj itildiyse Trivy
  # kapısı docker işini kırmızı yapsa bile açılış testi koşar (iki bilgi ayrı ayrı görünsün).
  image-boot-test:
    needs: docker
    if: ${{ !cancelled() && needs.docker.outputs.pushed == 'true' }}
    permissions:
      contents: read
      packages: read   # ghcr.io pull
    uses: ./.github/workflows/image-boot-test.yml
    with:
      image: ${{ needs.docker.outputs.image }}
