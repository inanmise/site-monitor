name: Docker — Build & Push

on:
  push:
    branches:
      # main'de imaj Release workflow'u tarafından (yeni sürüm tag'i + latest) build/push
      # edilir — burada tekrar etmemek için main hariç. develop/release'te Release yok.
      - develop
      - "release/**"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: site-monitor
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  docker:
    name: Build image (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for ghcr.io push
    # image-boot-test işi tam olarak bu push'un birincil etiketini çeker ve açar.
    outputs:
      primary: ${{ steps.tags.outputs.primary }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read VERSION
        id: version
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          REGISTRY="${{ env.REGISTRY }}"
          IMAGE="${{ env.IMAGE_NAME }}"
          # Güvenlik (CWE-94): attacker-influenceable metadata'yı run: içine GHA-expression ile GÖMME;
          # GitHub'ın built-in env değişkenlerini kullan (shell'e enjekte edilmez).
          GIT_SHA="$GITHUB_SHA"
          SHORT_SHA="${GIT_SHA:0:7}"
          BRANCH="$GITHUB_REF_NAME"

          case "$BRANCH" in
            main)
              TAGS="${REGISTRY}/${IMAGE}:${VERSION},${REGISTRY}/${IMAGE}:latest"
              PRIMARY="${VERSION}"
              ENV_VALUES="helm/site-monitor/environments/master.yaml"
              ;;
            release/*)
              TAGS="${REGISTRY}/${IMAGE}:${VERSION}-rc,${REGISTRY}/${IMAGE}:staging"
              PRIMARY="${VERSION}-rc"
              ENV_VALUES="helm/site-monitor/environments/release.yaml"
              ;;
            develop)
              TAGS="${REGISTRY}/${IMAGE}:develop-${SHORT_SHA},${REGISTRY}/${IMAGE}:develop"
              PRIMARY="develop-${SHORT_SHA}"
              ENV_VALUES="helm/site-monitor/environments/develop.yaml"
              ;;
            *)
              SAFE=$(echo "$BRANCH" | tr '/' '-' | tr -cd '[:alnum:]-')
              TAGS="${REGISTRY}/${IMAGE}:${SAFE}-${SHORT_SHA}"
              PRIMARY="${SAFE}-${SHORT_SHA}"
              ENV_VALUES=""
              ;;
          esac

          echo "tags=${TAGS}"             >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY}"       >> "$GITHUB_OUTPUT"
          echo "env_values=${ENV_VALUES}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"   >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Security: container image vulnerability scan ──
      # Non-blocking until baseline is clean; switch exit-code to '1' once
      # current HIGH/CRITICAL CVEs are triaged.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.primary }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Image summary
        run: |
          echo "## Docker image built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Primary tag | \`${{ steps.tags.outputs.primary }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| All tags | \`${{ steps.tags.outputs.tags }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.tags.outputs.env_values }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Helm deploy command" >> "$GITHUB_STEP_SUMMARY"
            echo '```bash' >> "$GITHUB_STEP_SUMMARY"
            echo "helm upgrade --install site-monitor ./helm/site-monitor \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  -f helm/site-monitor/values.yaml \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  -f ${{ steps.tags.outputs.env_values }} \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --set image.tag=${{ steps.tags.outputs.primary }} \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \\" >> "$GITHUB_STEP_SUMMARY"
            echo "  -n site-monitor --create-namespace" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────────────────────────────
  # İmaj açılış testi (2026-10-02, onaylı öneri 28)
  #
  # Az önce itilen imajı (birincil etiket) BOŞ bir postgres:16'ya karşı prod profiliyle, Helm'deki gibi salt-okunur
  # kök dosya sistemiyle (yalnız /tmp ve /var/log yazılabilir) ve release ortamının bellek/CPU tavanıyla açar;
  # /health/readiness UP olunca scripts/image-boot-check.sh: /health UP, /api/branding 200, oturumsuz /api 401,
  # sitemonitor_schema_patch_failed = 0 / _locked = 1, günlükte "Şema yamaları:" özeti var ve BAŞARISIZ yok,
  # ERROR satırı / açılış istisnası yok. Hata olursa son 200 günlük satırı basılır, tam günlük artefakt olur.
  # Bu workflow sürüm kapısı DEĞİL (release.yml yalnız ci.yml'i bekler) — yeni iş hiçbir yayını bloklamaz.
  # Kimlik bilgileri tek kullanımlık sahte değerlerdir (servis konteyneri iş bitince yok olur).
  # ──────────────────────────────────────────────
  image-boot-test:
    name: Image boot test (prod profile / postgres:16)
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read   # ghcr.io pull

    services:
      postgres:
        image: postgres:16.15-trixie@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: sitemonitor
          POSTGRES_USER: sitemonitor
          POSTGRES_PASSWORD: boot-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitemonitor -d sitemonitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PRIMARY_TAG: ${{ needs.docker.outputs.primary }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # REGISTRY / IMAGE_NAME iş akışı düzeyi env'den (adımlarda kabuk değişkeni); iş düzeyi env'de env bağlamı yok.
      - name: Resolve image reference
        run: |
          [ -n "$PRIMARY_TAG" ] || { echo "::error::docker işi birincil etiketi vermedi"; exit 1; }
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME}:${PRIMARY_TAG}" >> "$GITHUB_ENV"
          echo "Boot test image: ${REGISTRY}/${IMAGE_NAME}:${PRIMARY_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "$IMAGE"

      # --network host: servis konteynerinin 5432'si runner'da localhost'ta; uygulama 8080'i doğrudan açar.
      - name: Start container (prod profile, read-only root FS)
        run: |
          SECRET_KEY="$(openssl rand -hex 32)"
          docker run -d --name sm --network host \
            --read-only --tmpfs /tmp:rw,exec,mode=1777 --tmpfs /var/log:rw,mode=1777 \
            --memory 1g --cpus 2 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e LOG_LEVEL=INFO \
            -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=sitemonitor \
            -e DB_USER=sitemonitor -e DB_PASSWORD=boot-test-only \
            -e ADMIN_USERNAME=boottest -e ADMIN_PASSWORD=BootTest-Only-2026 \
            -e SITE_MONITOR_SECRET_KEY="$SECRET_KEY" \
            -e SITE_MONITOR_EMAIL_ENABLED=false \
            -e SPRING_SESSION_STORE_TYPE=jdbc \
            -e STARTUP_CHECK_DELAY_MS=600000 \
            -e JAVA_OPTS="-XX:MaxRAMPercentage=75.0 -XX:MinRAMPercentage=50.0 -Xss512k -XX:+ExitOnOutOfMemoryError" \
            "$IMAGE"

      - name: Wait for readiness (max 180 s)
        run: |
          for i in $(seq 1 90); do
            if curl -fsS --max-time 3 http://localhost:8080/health/readiness 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Ready after ~$((i * 2)) s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' sm 2>/dev/null)" != "true" ]; then
              echo "::error::Container exited during startup (exit code $(docker inspect -f '{{.State.ExitCode}}' sm 2>/dev/null))"
              exit 1
            fi
            sleep 2
          done
          echo "::error::/health/readiness did not report UP within 180 s"
          exit 1

      - name: Boot checks (health, auth gate, schema patches, startup log)
        run: |
          docker logs sm > boot.log 2>&1
          bash scripts/image-boot-check.sh http://localhost:8080 boot.log

      - name: Container log (last 200 lines)
        if: failure()
        run: |
          docker logs sm > boot.log 2>&1 || true
          tail -n 200 boot.log || true

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-boot-log
          path: boot.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop container
        if: always()
        run: docker rm -f sm >/dev/null 2>&1 || true
