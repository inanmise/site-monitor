name: CI — Build & Test

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    branches:
      - develop
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Saat dilimi ACIKCA sabit: runner bugun UTC ama bu bir GARANTI degil, varsayilan.
  # Yerel kosum da (pom surefire -Duser.timezone=UTC) UTC oldugu icin ikisi birebir ayni.
  TZ: UTC

# En az ayrıcalık: GITHUB_TOKEN yalnız okuma (fork PR tetikli; job'lar yazma iznine ihtiyaç duymaz).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend — Maven build + tests
  # ──────────────────────────────────────────────
  backend:
    name: Backend (Java 25 / Maven)
    runs-on: ubuntu-latest
    # Sonsuz bekleme savunması (2026-10-09): takılan bir adım işi GitHub'ın 6 saatlik sınırına dek tutmasın.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Configure Maven mirror & retry
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << 'SETTINGS'
          <settings>
            <mirrors>
              <mirror>
                <id>central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://repo1.maven.org/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS

      - name: Build & test
        env:
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=60000
            -Dmaven.wagon.http.readTimeout=180000
        run: mvn -B clean verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report (Jacoco)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 1b. Backend — GERÇEK PostgreSQL entegrasyon testleri (2026-10-02, onaylı öneri 28)
  #
  # Neden ayrı iş: yukarıdaki suit H2'de (PostgreSQL uyumluluk modu) koşar ve SchemaPatchRunner H2'de
  # PostgreSQL'e özgü her yama hatasını "beklenen" sayıp yutar — bozuk bir yama ilk kez prod pod'unun WARN
  # satırında görülürdü. Bu iş BOŞ bir postgres:16'da tam uygulama bağlamını iki kez açar (0 başarısız yama +
  # idempotentlik + adı geçen her indeks/kolon/kısıt gerçekten var), PostgreSQL'e özgü SQL'i (ON CONFLICT,
  # kısmi indeks, LATERAL, advisory lock) ve yoklanan ekranların ağır sorgularını koşar.
  # Yalnız @Tag("postgres") testleri (-Ppostgres-it; varsayılan `mvn verify` onları DIŞARIDA bırakır).
  # IT_DB_REQUIRED=true: bağlantı kurulamazsa testler atlanmaz, iş KIRMIZI olur ("0 test, yeşil" olmasın).
  # Kapı: release.yml bu workflow'un sonucunu bekler; suit yerelde gerçek PostgreSQL 16'da yeşil doğrulandı.
  # Servis imajı Dockerfile gibi TAM etiket + çoklu-mimari index digest'iyle sabit (yenileme: Dockerfile başı).
  # ──────────────────────────────────────────────
  backend-postgres-it:
    name: Backend PostgreSQL IT (Java 25 / postgres:16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.15-trixie@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_DB: sitemonitor_it
          POSTGRES_USER: sitemonitor_it
          # Yalnız bu işin tek kullanımlık servis konteyneri — gizli değil.
          POSTGRES_PASSWORD: sitemonitor_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitemonitor_it -d sitemonitor_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Configure Maven mirror & retry
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << 'SETTINGS'
          <settings>
            <mirrors>
              <mirror>
                <id>central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://repo1.maven.org/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          SETTINGS

      - name: PostgreSQL integration tests
        env:
          MAVEN_OPTS: >-
            -Dmaven.wagon.http.retryHandler.count=3
            -Dmaven.wagon.http.connectionTimeout=60000
            -Dmaven.wagon.http.readTimeout=180000
          IT_DB_URL: jdbc:postgresql://localhost:5432/sitemonitor_it
          IT_DB_USER: sitemonitor_it
          IT_DB_PASSWORD: sitemonitor_it
          IT_DB_REQUIRED: "true"
        run: mvn -B -Ppostgres-it test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-postgres-it-report
          path: backend/target/surefire-reports/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 2. Frontend — Node build + lint
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Node 24 / Vite)
    runs-on: ubuntu-latest
    # Sonsuz bekleme savunması (2026-10-09): takılan bir adım işi GitHub'ın 6 saatlik sınırına dek tutmasın.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # Birim testleri ve kapsam kapısı ayrı işlerde: `frontend-unit` (4 parça) + `frontend-coverage` (birleştirme).
      - name: Build
        run: npm run build

      # ── Security: dependency vulnerability scan (non-blocking until baseline is clean) ──
      - name: npm audit (high+ severity, prod deps only)
        run: npm audit --audit-level=high --omit=dev || true

  # ──────────────────────────────────────────────
  # 2a. Frontend birim testleri — 4 PARÇA (2026-10-08)
  #
  # Neden parçalı: private repoda standart runner 2 vCPU; vitest varsayılanı "CPU − 1" = TEK işçi, yani
  # takım (580+ dosya, kapsamla) fiilen SIRAYLA koşuyor ve tek iş 29–50 dk sürüyordu (2026-10-05'e kadar
  # runner 4 vCPU / 3 işçi idi: 15–21 dk; Playwright de aynı gün "2 workers" → "1 worker" oldu). Her parça
  # ayrı runner'da 2 işçiyle koşar ve ham kapsamı blob raporuna yazar. VITEST_COVERAGE_SHARD=1 parçada
  # eşik ve rapor üretimini kapatır (vite.config.js) — parça kapsamın yalnız bir kısmını görür. Global eşik
  # ve dosya tabanı `frontend-coverage` işinde BİRLEŞTİRİLMİŞ kapsam üzerinde zorlanır: kapı zayıflamaz.
  # ──────────────────────────────────────────────
  frontend-unit:
    name: Frontend unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (shard ${{ matrix.shard }}/4, coverage collected)
        env:
          VITEST_COVERAGE_SHARD: "1"
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/4 --maxWorkers=2 --reporter=blob --reporter=dot

      # `.vitest-reports` noktayla başlar: upload-artifact gizli dosyaları varsayılan olarak ATLAR.
      - name: Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────
  # 2b. Frontend kapsam kapısı — parçaların blob raporları birleştirilir
  #
  # `vitest --merge-reports --coverage` dört parçanın test sonuçlarını ve kapsamını tek raporda toplar ve
  # vite.config.js test.coverage.thresholds eşiğini BURADA zorlar (taban altında FAIL); ardından dosya-bazlı
  # taban (coverage:floor) aynı birleştirilmiş json-summary'den okunur.
  # ──────────────────────────────────────────────
  frontend-coverage:
    name: Frontend coverage gate
    needs: frontend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest-reports
          merge-multiple: true

      # Kapsam eşiğini zorlayan adım (vite.config.js test.coverage.thresholds) — taban altında FAIL eder.
      - name: Merge shards + coverage gate
        run: npx vitest --merge-reports --coverage --reporter=dot

      # Global eşik büyük+kapsamsız dosyaları ortalamanın arkasına gizliyordu (2026-08-19
      # SystemHealth olayı: 2324 satır, %11.94). Bu adım dosya-bazlı tabanı zorlar.
      - name: Coverage floor (large components)
        run: npm run coverage:floor

  # ──────────────────────────────────────────────
  # 2c. Frontend E2E — GERÇEK tarayıcı
  #
  # Neden ayrı iş: jsdom düzen/boyama hesaplamaz; `position`, `overflow`, sarma, üst üste binme ve
  # kaydırma senkronu orada GÖRÜNMEZ. 2026-08-14'te k6 editörüne satır cetveli eklerken editör
  # kullanılamaz hâle geldi ve 664 vitest testi + `npm run build` yeşildi. Bu iş tam o sınıfı
  # kapsar. Ayrı tutulmasının sebebi tarayıcı indirmesinin `frontend` işini yavaşlatmaması.
  #
  # 4 PARÇA (2026-10-08): 2 vCPU runner'da Playwright tek işçiyle koşuyordu (~24 dk). `fullyParallel: true`
  # olduğundan `--shard` testleri tek tek dağıtır; her parça kendi Vite sunucusunu ve Chromium'unu kurar.
  # ──────────────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Tarayıcı önbelleği BİLİNÇLİ olarak yok: repo tüm action'ları SHA ile pinliyor,
      # yalnız bunun için pinsiz bir `actions/cache` eklemek politikayı deler. İndirme ~30 sn.
      # Runner imajı Google Chrome'un apt kaynağını taşır; Playwright'in KENDİ Chromium'u için
      # GEREKSİZDİR (--with-deps yalnız Ubuntu depolarından sistem kütüphanesi kurar). 2026-09-09'da
      # o depo bozuk indeks sunmaya başladı ("Hash Sum mismatch") ve apt-get update exit 100 verdi;
      # üç ardışık koşumda aynı hata geldi, yani geçici dalgalanma değil. Kaynağı devre dışı
      # bırakmak KAPIYI ZAYIFLATMAZ: hiçbir test atlanmaz, aynı tarayıcı ve aynı kütüphaneler
      # kurulur — yalnız ilgisiz bir üçüncü taraf deposu apt'nin yolundan çekilir.
      - name: Drop unrelated third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (shard ${{ matrix.shard }}/4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. Helm lint
  # ──────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    # Sonsuz bekleme savunması (2026-10-09): takılan bir adım işi GitHub'ın 6 saatlik sınırına dek tutmasın.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.14.0

      - name: Lint chart (master values)
        run: |
          helm lint helm/site-monitor \
            -f helm/site-monitor/values.yaml \
            -f helm/site-monitor/environments/master.yaml

      - name: Lint chart (develop values)
        run: |
          helm lint helm/site-monitor \
            -f helm/site-monitor/values.yaml \
            -f helm/site-monitor/environments/develop.yaml

      - name: Lint chart (release values)
        run: |
          helm lint helm/site-monitor \
            -f helm/site-monitor/values.yaml \
            -f helm/site-monitor/environments/release.yaml
