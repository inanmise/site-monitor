name: CI — Build & Test

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    branches:
      - develop
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend — Maven build + tests
  # ──────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build & test
        run: mvn -B clean verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/
          retention-days: 7

  # ──────────────────────────────────────────────
  # 2. Frontend — Node build + lint
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Node 24 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # 3. Helm lint
  # ──────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint chart (master values)
        run: |
          helm lint helm/cert-monitor \
            -f helm/cert-monitor/values.yaml \
            -f helm/cert-monitor/environments/master.yaml

      - name: Lint chart (develop values)
        run: |
          helm lint helm/cert-monitor \
            -f helm/cert-monitor/values.yaml \
            -f helm/cert-monitor/environments/develop.yaml

      - name: Lint chart (release values)
        run: |
          helm lint helm/cert-monitor \
            -f helm/cert-monitor/values.yaml \
            -f helm/cert-monitor/environments/release.yaml
