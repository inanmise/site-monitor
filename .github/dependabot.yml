# Dependabot — haftalık bağımlılık güncelleme PR'ları (CI ile doğrulanır → riskli major bumplar güvenle gelir).
# SCA gate: ci.yml `npm audit --audit-level=high` + (opsiyonel) OWASP dependency-check.
version: 2
updates:
  # Backend (Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 4.1.1'de SABİT (2026-11-14): 4.1.2 ve sonrası (4.2.3 dahil) Node / Vitest altında yüklenmiyor —
      # esm/index.common.js uzantısız `./Editor.common` içe aktarıyor (ERR_MODULE_NOT_FOUND; PR #117 birim
      # testleri bununla düştü). package.json'da da tam sürüm yazılı. Üst akış düzeltince bu kuralı kaldırın.
      - dependency-name: "@uiw/react-md-editor"
        versions: [">4.1.1"]

  # GitHub Actions (SHA-pinned → dependabot pin'leri günceller)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base image'leri (Dockerfile FROM — floating tag → güncel/digest PR'ları)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
