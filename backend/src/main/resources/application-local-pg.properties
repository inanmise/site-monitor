# Local development profile with PostgreSQL
# Activate with: SPRING_PROFILES_ACTIVE=local-pg

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certmonitor}
spring.datasource.username=${DB_USER:certmonitor}
spring.datasource.password=${DB_PASSWORD:certmonitor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# ─────────────────────────────────────────────────────────────
# Logging — local-pg dev: verbose output + SQL visibility
# Override: LOG_LEVEL=TRACE to see everything
# ─────────────────────────────────────────────────────────────
logging.level.com.certmonitor=${LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN
