# Local development profile with PostgreSQL
# Activate with: SPRING_PROFILES_ACTIVE=local-pg

# Serve pre-built frontend — no Vite needed, just http://localhost:8080
spring.web.resources.static-locations=file:../frontend/dist/,classpath:/static/
spring.web.resources.cache.period=0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certmonitor}
spring.datasource.username=${DB_USER:certmonitor}
spring.datasource.password=${DB_PASSWORD:certmonitor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# Tek aktif oturum özelliğinin lokalde test edilebilmesi + prod paritesi: oturumları DB'de tut
# (JdbcIndexedSessionRepository → principal_name index ile kullanıcı-bazlı oturum kapatma).
# Lokal Postgres ayakta olduğundan eager-init sorunu olmaz. SPRING_SESSION_STORE_TYPE ile geçersiz kılınabilir.
spring.session.store-type=${SPRING_SESSION_STORE_TYPE:jdbc}

# ─────────────────────────────────────────────────────────────
# Logging — local-pg dev: verbose output + SQL visibility
# Override: LOG_LEVEL=TRACE to see everything
# ─────────────────────────────────────────────────────────────
logging.level.com.certmonitor=${LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN
