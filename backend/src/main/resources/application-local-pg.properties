# Local development profile with PostgreSQL
# Activate with: SPRING_PROFILES_ACTIVE=local-pg

# Serve pre-built frontend — no Vite needed, just http://localhost:8080
spring.web.resources.static-locations=file:../frontend/dist/,classpath:/static/
spring.web.resources.cache.period=0

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certmonitor}
spring.datasource.username=${DB_USER:certmonitor}
spring.datasource.password=${DB_PASSWORD:certmonitor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Havuz (2026-10-12): 5 bağlantı, 20 iş parçacıklı kontrol havuzu + zamanlanmış işler + web istekleriyle paylaşılınca
# tarama anında istekler bağlantı BEKLİYORDU (Sistem Sağlığı: "1 thread DB bağlantısı bekliyor"). 15 yerel PostgreSQL'in
# varsayılan max_connections (100) sınırının rahat altında. minimum-idle genel ayardan 10 geliyordu — tavanla çelişmesin
# ve yerelde boşta 10 bağlantı tutulmasın diye 2.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# ─────────────────────────────────────────────────────────────
# Logging — local-pg dev: verbose output + SQL visibility
# Override: LOG_LEVEL=TRACE to see everything
# ─────────────────────────────────────────────────────────────
logging.level.com.sitemonitor=${LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=WARN
