server.port=8080

# ─────────────────────────────────────────────────────────────
# Database — SQLite for local dev | override via env vars for PostgreSQL
# ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:sqlite:../data/certificates.db?journal_mode=WAL&busy_timeout=5000}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP — SQLite allows only one concurrent writer; pool-size=1 prevents SQLITE_BUSY.
# For PostgreSQL deployments set DB_POOL_MAX=10 (or higher) via environment variable.
spring.datasource.hikari.pool-name=CertMonitorPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:1}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ─────────────────────────────────────────────────────────────
# Spring Session — JDBC for distributed sessions (HA)
# Set SPRING_SESSION_STORE_TYPE=jdbc in Kubernetes for multi-node
# ─────────────────────────────────────────────────────────────
spring.session.store-type=${SPRING_SESSION_STORE_TYPE:none}
spring.session.jdbc.initialize-schema=always
spring.session.timeout=24h

# ─────────────────────────────────────────────────────────────
# Session cookies
# ─────────────────────────────────────────────────────────────
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ─────────────────────────────────────────────────────────────
# Auth
# ─────────────────────────────────────────────────────────────
cert.monitor.username=${CERT_MONITOR_USERNAME:user}
cert.monitor.password=${CERT_MONITOR_PASSWORD:password}
cert.monitor.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}

# ─────────────────────────────────────────────────────────────
# CORS — comma-separated allowed origins (restrict in production)
# ─────────────────────────────────────────────────────────────
cert.monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─────────────────────────────────────────────────────────────
# Certificate checker
# ─────────────────────────────────────────────────────────────
cert.monitor.cert-list-file=../sertifikaListesi.txt
cert.monitor.check-timeout-seconds=${CHECK_TIMEOUT_SECONDS:10}
cert.monitor.warning-days=${WARNING_DAYS:30}
cert.monitor.parallel-workers=${PARALLEL_WORKERS:20}

# ─────────────────────────────────────────────────────────────
# Email — disabled by default; configure via env vars
# ─────────────────────────────────────────────────────────────
cert.monitor.email.enabled=${CERT_MONITOR_EMAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cert.monitor.email.to=${CERT_MONITOR_EMAIL_TO:}
cert.monitor.email.from=${CERT_MONITOR_EMAIL_FROM:noreply@certmonitor}

# ─────────────────────────────────────────────────────────────
# Caffeine cache — 1-minute TTL, max 1 000 entries per cache
# ─────────────────────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s

# ─────────────────────────────────────────────────────────────
# Response compression (performance)
# ─────────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/plain,application/javascript
server.compression.min-response-size=1024

# ─────────────────────────────────────────────────────────────
# Graceful shutdown — wait up to 30 s for in-flight requests (Kubernetes SIGTERM)
# ─────────────────────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ─────────────────────────────────────────────────────────────
# Jackson
# ─────────────────────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# ─────────────────────────────────────────────────────────────
# Actuator / Prometheus
# ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.health.mail.enabled=false
management.health.db.enabled=true
management.info.env.enabled=true
