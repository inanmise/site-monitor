server.port=8080

# SQLite (dev default)
spring.datasource.url=jdbc:sqlite:../data/certificates.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# Session
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Auth — override with env vars: CERT_MONITOR_USERNAME / CERT_MONITOR_PASSWORD
cert.monitor.username=${CERT_MONITOR_USERNAME:user}
cert.monitor.password=${CERT_MONITOR_PASSWORD:changeme-local-dev}

# CORS — comma-separated list of allowed origins
cert.monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Certificate checker
cert.monitor.cert-list-file=../sertifikaListesi.txt
cert.monitor.check-timeout-seconds=10
cert.monitor.warning-days=30
cert.monitor.parallel-workers=20

# Email — disabled by default; set via env vars
cert.monitor.email.enabled=${CERT_MONITOR_EMAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cert.monitor.email.to=${CERT_MONITOR_EMAIL_TO:}
cert.monitor.email.from=${CERT_MONITOR_EMAIL_FROM:noreply@certmonitor}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.health.mail.enabled=false
management.health.db.enabled=true
