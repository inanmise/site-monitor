server.port=8080

# Frontend static files — served from dist folder (Docker: ./frontend/dist, local-pg overrides)
spring.web.resources.static-locations=file:./frontend/dist/,classpath:/static/

# ─────────────────────────────────────────────────────────────
# Database — PostgreSQL
# ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/certmonitor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Disable Open-Session-In-View (prod anti-pattern):
# - DB connection released as soon as transaction commits, not at end of HTTP request
# - Long I/O (SMTP, HTTP) after DB ops no longer holds Hikari connection
# - Safe: entities have no lazy associations (all DTO-mapped before service returns)
spring.jpa.open-in-view=false
# @Scheduled havuzu (tek-thread yerine): cert sweep'leri ile ayar-cache refresh'leri (çok-pod
# tutarlılığı) birbirini bloklamasın. Her @Scheduled metodu kendisiyle yine seri (fixedDelay).
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:4}
# Çok-pod: LDAP/SMTP/genel ayar/permission cache'lerinin DB'den periyodik tazelenme aralığı (ms).
cert.monitor.settings.refresh-ms=${SETTINGS_REFRESH_MS:10000}
# Batch-fetch lazy collections/associations in groups (ileriye dönük N+1 koruması)
spring.jpa.properties.hibernate.default_batch_fetch_size=20
# Batch write (UPDATE/DELETE gruplama + saveAll). NOT: tüm entity'ler IDENTITY id
# kullandığından Hibernate INSERT'leri batch'leyemez; asıl fayda UPDATE/DELETE ve
# çoklu-flush'ta. Gerçek INSERT-batch için SEQUENCE'a geçiş gerekir (kapsam dışı).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP
spring.datasource.hikari.pool-name=CertMonitorPool
# Tek pod 100 kullanıcı: havuz 10→25. Tek pod → tek Postgres'e ~25 bağlantı güvenli (replica çarpımı
# YOK). Not: çok-pod'a geçilirse (replica × 25) Postgres max_connections'ı aşmasın diye düşürülmeli.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:10}
# connection-timeout: havuz tükendiğinde/DB düştüğünde istek bu kadar bekleyip başarısız olur (hızlı-başarısızlık).
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:10000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# keepalive-time: boştaki bağlantıyı periyodik doğrula → postgres restart'ında bayat bağlantıyı proaktif at,
# blip sonrası havuz hızlı dolsun ("connection has been closed" sürprizi canlı isteğe daha az vursun).
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}

# ─────────────────────────────────────────────────────────────
# Tomcat thread havuzu — tek pod 100 kullanıcı: tavanı 200→100 (havuz 25 ile dengede). Kazanç:
# 100 × 512k thread-stack ≈ 50MB heap-dışı tasarruf (dar tek-pod heap'i için önemli); ayrıca 175
# thread'i 25 bağlantıda kuyruklamak yerine makul tavan. Havuz zaten hızlı-başarısızlık kapısı.
# ─────────────────────────────────────────────────────────────
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}

# ─────────────────────────────────────────────────────────────
# Spring Session — JDBC for distributed sessions (HA)
# Set SPRING_SESSION_STORE_TYPE=jdbc in Kubernetes for multi-node
# ─────────────────────────────────────────────────────────────
spring.session.store-type=${SPRING_SESSION_STORE_TYPE:none}
spring.session.jdbc.initialize-schema=always
spring.session.timeout=24h

# ─────────────────────────────────────────────────────────────
# Session cookies
# ─────────────────────────────────────────────────────────────
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ─────────────────────────────────────────────────────────────
# Auth & login security
# ─────────────────────────────────────────────────────────────
cert.monitor.username=${CERT_MONITOR_USERNAME:user}
cert.monitor.password=${CERT_MONITOR_PASSWORD:password}
cert.monitor.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
cert.monitor.login.block-seconds=${LOGIN_BLOCK_SECONDS:30}
# Parola politikası — prod-uygun varsayılanlar (env ile override edilebilir). Eski 6/10/3 zayıftı:
# 10 karakter ÜST sınırı modern standartlara aykırıydı (passphrase'i engeller).
cert.monitor.password.min-length=${PASSWORD_MIN_LENGTH:12}
cert.monitor.password.max-length=${PASSWORD_MAX_LENGTH:64}
cert.monitor.password.history-count=${PASSWORD_HISTORY_COUNT:5}

# Symmetric key used to encrypt secrets stored at rest (e.g. the LDAP bind
# password). MUST be set to a stable value across pods in production (K8s
# secret) so a value encrypted on one node decrypts on another. Dev default
# is insecure and only suitable for local runs.
cert.monitor.secret-key=${CERT_MONITOR_SECRET_KEY:}

# ─────────────────────────────────────────────────────────────
# Progressive lockout
# Durations (seconds) and required-failure counts per level — comma-separated.
# Level 1→2→3→4→permanent. Durations: 30 s, 2 min, 10 min, 30 min.
# ─────────────────────────────────────────────────────────────
cert.monitor.lockout.durations-seconds=${LOCKOUT_DURATIONS_SECONDS:30,120,600,1800}
cert.monitor.lockout.failures-needed=${LOCKOUT_FAILURES_NEEDED:5,3,2,1}

# ─────────────────────────────────────────────────────────────
# Audit / anomaly detection
# ─────────────────────────────────────────────────────────────
cert.monitor.audit.brute-force-window-seconds=${BRUTE_FORCE_WINDOW_SECONDS:600}
cert.monitor.audit.geo-velocity-window-seconds=${GEO_VELOCITY_WINDOW_SECONDS:3600}
cert.monitor.audit.office-start-hour=${OFFICE_START_HOUR:8}
cert.monitor.audit.office-end-hour=${OFFICE_END_HOUR:23}

# ─────────────────────────────────────────────────────────────
# Remember-me tokens
# ─────────────────────────────────────────────────────────────
cert.monitor.remember.ttl-seconds=${REMEMBER_TTL_SECONDS:604800}
cert.monitor.remember.cleanup-interval-ms=${REMEMBER_CLEANUP_INTERVAL_MS:3600000}

# ─────────────────────────────────────────────────────────────
# GeoIP lookup (used for audit log enrichment)
# ─────────────────────────────────────────────────────────────
cert.monitor.geoip.api-url=${GEOIP_API_URL:http://ip-api.com/json/%s?fields=status,country,city,org}
cert.monitor.geoip.timeout-millis=${GEOIP_TIMEOUT_MILLIS:500}
cert.monitor.geoip.cache-ttl-ms=${GEOIP_CACHE_TTL_MS:3600000}

# ─────────────────────────────────────────────────────────────
# Scheduler
# ─────────────────────────────────────────────────────────────
cert.monitor.scheduler.cron=${SCHEDULER_CRON:0 0 * * * *}
cert.monitor.scheduler.stale-check-interval-ms=${SCHEDULER_STALE_CHECK_INTERVAL_MS:300000}
cert.monitor.scheduler.stale-minutes=${SCHEDULER_STALE_MINUTES:65}
cert.monitor.scheduler.lock-ttl-minutes=${SCHEDULER_LOCK_TTL_MINUTES:10}
# İzleme sweep'leri (uptime/port/keyword/ping/dns) için tüm-tur dağıtık kilit TTL'i.
# 2+ pod'da bir turu yalnız bir pod çalıştırır (mükerrer probe/geçmiş kaydı önlenir).
cert.monitor.scheduler.sweep-lock-ttl-minutes=${SWEEP_LOCK_TTL_MINUTES:2}
# Envanter domain-expiry (registrar süre bitişi) cache'ini RDAP/WHOIS'ten günlük tazeler — haftalık rapor
# bunu okur; domain yenilenince bayat kalmasın diye. Cuma ~09:00 raporundan önce (04:15 IST). Kapatılabilir.
cert.monitor.scheduler.domain-expiry-refresh-cron=${DOMAIN_EXPIRY_REFRESH_CRON:0 15 4 * * *}
cert.monitor.scheduler.domain-expiry-refresh.enabled=${DOMAIN_EXPIRY_REFRESH_ENABLED:true}
# Açılışta ağır sertifika taraması + escalation catch-up bu kadar gecikmeyle başlar
# (ms). JVM ısınması + ilk interaktif istekler (login/BCrypt) CPU'yu serbest bulsun
# diye; 0 = anında (eski davranış).
cert.monitor.scheduler.startup-check-delay-ms=${STARTUP_CHECK_DELAY_MS:60000}

# ─────────────────────────────────────────────────────────────
# Default alert thresholds (applied only when the DB has no threshold row)
# ─────────────────────────────────────────────────────────────
cert.monitor.alert.default-warning-days=${ALERT_DEFAULT_WARNING_DAYS:30}
cert.monitor.alert.default-high-days=${ALERT_DEFAULT_HIGH_DAYS:15}
cert.monitor.alert.default-critical-days=${ALERT_DEFAULT_CRITICAL_DAYS:7}
cert.monitor.alert.default-realert-hours=${ALERT_DEFAULT_REALERT_HOURS:24}

# ─────────────────────────────────────────────────────────────
# Cert-check executor thread pool
# ─────────────────────────────────────────────────────────────
cert.monitor.executor.core-size=${EXECUTOR_CORE_SIZE:20}
cert.monitor.executor.max-size=${EXECUTOR_MAX_SIZE:50}
cert.monitor.executor.queue-capacity=${EXECUTOR_QUEUE_CAPACITY:1000}

# ─────────────────────────────────────────────────────────────
# Outbound HTTP proxy for SSL/cert checks (CONNECT tunnel)
# Empty host disables proxy → direct outbound. NO_PROXY supports
# exact host, leading-dot suffix (.foo.com), or bare suffix (foo.com).
# ─────────────────────────────────────────────────────────────
cert.monitor.proxy.host=${HTTP_PROXY_HOST:}
cert.monitor.proxy.port=${HTTP_PROXY_PORT:0}
cert.monitor.proxy.user=${HTTP_PROXY_USER:}
cert.monitor.proxy.pass=${HTTP_PROXY_PASS:}
cert.monitor.proxy.no-proxy=${NO_PROXY:}
# Direct kontrol TCP düzeyinde başarısız olunca OTOMATİK proxy'ye düşülsün mü? Varsayılan KAPALI:
# domain'in "Proxy Üzerinden Kontrol Et = Hayır" tercihi kesin onurlanır (internal domain'ler DMZ proxy'sine
# yönlenmesin). Eski auto-fallback davranışı için true yapın.
cert.monitor.proxy.auto-fallback=${PROXY_AUTO_FALLBACK:false}

# ─────────────────────────────────────────────────────────────
# Kurumsal SSL-araya-giren (MITM) proxy kök/ara CA paketi (PEM, çok satırlı).
# TrustEvaluator bunu cacerts'e EK trust anchor olarak kullanır → RDAP/outbound
# HTTPS, proxy'nin yeniden imzaladığı zinciri PKIX ile doğrulayabilir (trust-all YOK).
# Boş = yalnız public CA'lar (cacerts). Genel Ayarlar'daki aynı anahtar (DB override)
# bu varsayılanın ÜSTÜNE biner; CA rotasyonunda Helm value'sunu güncelle (runbook).
cert.monitor.trust.ca-bundle-pem=${TRUST_CA_BUNDLE_PEM:}

# CA otomatik sabitleme (auto-pin / TOFU): strict HTTP kontrolü ya da RDAP çıkışı PKIX ile düşerse
# sunucunun CA'sı host:port başına DB'ye pinlenir ve istek bir kez tekrarlanır (kurumsal SSL-inspection
# proxy CA'sı elle bundle girmeden kendiliğinden tanınır); süresi dolan pinler her gece (refresh-cron)
# sunucudan yeniden çekilir. Admin onayı yok — her pin/rotasyon audit'e yazılır (CA_PINNED / CA_ROTATED).
# Kapsam: HTTP uptime strict yolu + RDAP (RdapDomainClient); sertifika trust_status raporu pinlere bakmaz.
cert.monitor.trust.auto-pin.enabled=${TRUST_AUTO_PIN_ENABLED:true}
cert.monitor.trust.auto-pin.refresh-cron=${TRUST_AUTO_PIN_REFRESH_CRON:0 20 3 * * *}

# ─────────────────────────────────────────────────────────────
# Logging timezone — only affects log line timestamps, not business data.
# Business timestamps (audit, alerts, notifications) stay UTC in DB.
# Override per deployment via LOG_TIMEZONE env var (e.g. Europe/Istanbul, UTC).
# ─────────────────────────────────────────────────────────────
cert.monitor.log.timezone=${LOG_TIMEZONE:Europe/Istanbul}

# ─────────────────────────────────────────────────────────────
# Webhook delivery
# ─────────────────────────────────────────────────────────────
cert.monitor.webhook.timeout-seconds=${WEBHOOK_TIMEOUT_SECONDS:10}

# ─────────────────────────────────────────────────────────────
# CRL cache (chain validation)
# ─────────────────────────────────────────────────────────────
cert.monitor.cache.crl-max-size=${CRL_CACHE_MAX_SIZE:200}
cert.monitor.cache.crl-ttl-hours=${CRL_CACHE_TTL_HOURS:1}

# ─────────────────────────────────────────────────────────────
# CORS — comma-separated allowed origins (restrict in production)
# ─────────────────────────────────────────────────────────────
cert.monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─────────────────────────────────────────────────────────────
# Certificate checker
# ─────────────────────────────────────────────────────────────
cert.monitor.check-timeout-seconds=${CHECK_TIMEOUT_SECONDS:6}
cert.monitor.warning-days=${WARNING_DAYS:30}
cert.monitor.parallel-workers=${PARALLEL_WORKERS:20}

# Retry transient WAF/rate-limit hiccups (Connection reset, timeout, etc.)
# once before declaring a cert unreachable. SSL/DNS/cert errors are never
# retried — they represent real issues.
cert.monitor.check.retry-on-transient=${CHECK_RETRY:true}
cert.monitor.check.retry-delay-ms=${CHECK_RETRY_DELAY:1000}
cert.monitor.check.max-attempts=${CHECK_MAX_ATTEMPTS:2}

# Retry with an ALTERNATE combo instead of identical parameters: TLS handshake
# stall → flip browser/default mode; direct TCP block → go via proxy; proxy
# unreachable → go direct. Deterministic blocks never self-heal on an
# identical retry.
cert.monitor.check.retry-fallback=${CHECK_RETRY_FALLBACK:true}

# Connection diagnostics (admin panel "Tanılama"): per-combo timeout for the
# direct/proxy × browser/default probe matrix.
cert.monitor.diagnostics.timeout-seconds=${DIAG_TIMEOUT_SECONDS:5}

# openssl derin SSL/TLS taraması (envanter tanılama) — binary yolu + komut
# zaman aşımı. openssl yoksa derin tarama "bulunamadı" döner (akış bozulmaz).
cert.monitor.diagnostics.openssl-bin=${OPENSSL_BIN:openssl}
cert.monitor.diagnostics.openssl-timeout-seconds=${OPENSSL_DIAG_TIMEOUT:8}

# Ağ derin analizi (ping/traceroute/dns/curl/ip) — komut başına zaman aşımı.
# Komutlar paralel çalışır; eksik binary/yetki zarif "kullanılamaz" döner.
cert.monitor.diagnostics.network-timeout-seconds=${NET_DIAG_TIMEOUT:10}

# TLS handshake fingerprint mode. "browser" forces TLS 1.2 + ALPN [h2,http/1.1]
# so WAFs (Akamai/F5/Imperva) that RST raw-Java ClientHellos accept us.
# Set TLS_MODE=default to revert to plain Java 21 defaults (TLS 1.3 etc.).
cert.monitor.check.tls-mode=${TLS_MODE:browser}

# Network bulk-failure detection — suppress cert alarm processing when
# network-class (DNS / TCP) errors dominate a single check run
cert.monitor.network.error-rate-threshold=${NETWORK_ERROR_THRESHOLD:0.50}
cert.monitor.network.min-errors=${NETWORK_MIN_ERRORS:3}

# Alarm fırtınası (alert storm) — kısa pencerede çok monitör birden düşünce bireysel alarmları TEK
# toplu bildirime indirger (yukarıdaki ≥%50 bulk-suppression'ın ALTINDA çalışır). Default AÇIK; admin
# "Alert Settings"ten kapatabilir. threshold-unit: COUNT (mutlak) | PERCENT (tüm monitörlerin %'si).
cert.monitor.storm.enabled=${STORM_ENABLED:true}
cert.monitor.storm.threshold-unit=${STORM_THRESHOLD_UNIT:COUNT}
cert.monitor.storm.threshold-value=${STORM_THRESHOLD_VALUE:5}
cert.monitor.storm.window-minutes=${STORM_WINDOW_MINUTES:5}
cert.monitor.storm.per-group=${STORM_PER_GROUP:false}
cert.monitor.storm.sweep-ms=${STORM_SWEEP_MS:30000}

# ─────────────────────────────────────────────────────────────
# İzleme alarmları (ACCESSIBILITY / PORT_DOWN / DNS_FAILURE / DNS_CHANGED).
# DOWN tespitinde confirm-* parametreleriyle (üç teyitli tip için ORTAK)
# 30 sn arayla 3 ardışık doğrulama; tümü başarısızsa envanter takımına
# CRITICAL alarm. Sorun düzelince alarm otomatik kapanır (çözüm maili ile).
# DNS_CHANGED: kayıt değişikliği teyitsiz anında HIGH alarm üretir ve
# otomatik kapanmaz (ack susturur, manuel resolve kapatır).
# ─────────────────────────────────────────────────────────────
cert.monitor.uptime.interval-ms=${UPTIME_INTERVAL_MS:300000}
cert.monitor.uptime.alert-enabled=${UPTIME_ALERT_ENABLED:true}
cert.monitor.port.alert-enabled=${PORT_ALERT_ENABLED:true}
cert.monitor.dns.alert-enabled=${DNS_ALERT_ENABLED:true}
# DNS yavaş/timeout alarmı (DNS_SLOW): çözüm başarılı ama response_ms eşiği aşarsa, 1 dk arayla 3 teyitte de
# yavaşsa alarm. query-timeout = ExtendedResolver per-sunucu timeout (primary timeout → fallback).
cert.monitor.dns.slow-threshold-ms=${DNS_SLOW_THRESHOLD_MS:1500}
cert.monitor.dns.query-timeout-ms=${DNS_QUERY_TIMEOUT_MS:2000}
cert.monitor.dns.slow-confirm-attempts=${DNS_SLOW_CONFIRM_ATTEMPTS:3}
cert.monitor.dns.slow-confirm-interval-ms=${DNS_SLOW_CONFIRM_INTERVAL_MS:60000}
# Çoklu-resolver tutarlılık (propagation) kontrolü için public resolver listesi (opt-in monitörlerde kullanılır).
cert.monitor.dns.resolvers=${DNS_RESOLVERS:8.8.8.8,1.1.1.1,9.9.9.9}
# HTTP metrik kalıcı serisi — kaç gün saklanacağı (gece temizliği eskileri siler). Sistem Sağlığı HTTP panelinden
# veya Genel Ayarlar'dan canlı değiştirilebilir.
cert.monitor.metrics.http.retention-days=${HTTP_METRICS_RETENTION_DAYS:7}
# Keyword (HTTP body anahtar kelime) + Ping (ICMP) — serbest-form izleme türleri.
# Teyit parametreleri (confirm-attempts/delay) uptime ile ortaktır.
# interval-ms = sweep GRANULARITY (30 sn) — gerçek kontrol sıklığı per-monitör intervalSeconds ile (gating).
cert.monitor.keyword.interval-ms=${KEYWORD_INTERVAL_MS:30000}
cert.monitor.keyword.alert-enabled=${KEYWORD_ALERT_ENABLED:true}
# Keyword yavaş SSL/Domain(WHOIS) sweep (günlük) — sıcak keyword uptime sweep'inden AYRI (KEYWORD_SSL/KEYWORD_DOMAIN_EXPIRY).
cert.monitor.keyword.ssl-domain-interval-ms=${KEYWORD_SSL_DOMAIN_INTERVAL_MS:86400000}
cert.monitor.port.interval-ms=${PORT_INTERVAL_MS:30000}
cert.monitor.ping.interval-ms=${PING_INTERVAL_MS:30000}
cert.monitor.ping.alert-enabled=${PING_ALERT_ENABLED:true}
# SSRF koruması (SsrfGuard) — giden izleme/tanılama hedefleri. Cloud-metadata (169.254.169.254) + loopback +
# link-local HER ZAMAN bloklanır. İç/private ağ (site-local) izleme bu iç araç için varsayılan AÇIK; admin kapatabilir.
# allow-loopback yalnız test/özel local-agent senaryoları için (varsayılan KAPALI).
cert.monitor.monitoring.allow-internal-targets=${MONITORING_ALLOW_INTERNAL_TARGETS:true}
cert.monitor.monitoring.allow-loopback-targets=${MONITORING_ALLOW_LOOPBACK_TARGETS:false}
# HTTP/Website izleme: sıcak uptime sweep granularity (30 sn) + yavaş SSL/Domain(WHOIS) sweep (günlük).
cert.monitor.http.interval-ms=${HTTP_INTERVAL_MS:30000}
cert.monitor.http.ssl-domain-interval-ms=${HTTP_SSL_DOMAIN_INTERVAL_MS:86400000}
cert.monitor.http.alert-enabled=${HTTP_ALERT_ENABLED:true}
cert.monitor.http.rdap-base-url=${HTTP_RDAP_BASE_URL:https://rdap.org/domain/}
# Domain (alan adı) izleme: RDAP (proxy-aware, IANA bootstrap + rdap.org fallback) + env-gated WHOIS/43.
cert.monitor.domain.interval-ms=${DOMAIN_INTERVAL_MS:3600000}
cert.monitor.domain.alert-enabled=${DOMAIN_ALERT_ENABLED:true}
cert.monitor.domain.rdap-bootstrap-url=${DOMAIN_RDAP_BOOTSTRAP_URL:https://data.iana.org/rdap/dns.json}
cert.monitor.domain.rdap-fallback-url=${DOMAIN_RDAP_FALLBACK_URL:https://rdap.org/domain/}
cert.monitor.domain.whois-enabled=${DOMAIN_WHOIS_ENABLED:true}
cert.monitor.domain.whois-servers=${DOMAIN_WHOIS_SERVERS:}
cert.monitor.domain.whois-timeout-ms=${DOMAIN_WHOIS_TIMEOUT_MS:6000}
# .tr (TRABIS) WHOIS — kaynaklar sırayla denenir (ilk parse edilen kazanır); kazanan kaynak sorgulama kartında gösterilir.
# isimtescil (HTTPS düz GET) → trabis (BTK resmi, HTTPS CSRF akışı) → trabis43 (ham TCP/43; kurumsal egress'te genelde kapalı, son çare).
cert.monitor.domain.tr-web-whois-enabled=${DOMAIN_TR_WEB_WHOIS_ENABLED:true}
cert.monitor.domain.tr-web-whois-providers=${DOMAIN_TR_WEB_WHOIS_PROVIDERS:isimtescil,trabis,trabis43}
cert.monitor.domain.isimtescil-whois-url=${DOMAIN_ISIMTESCIL_WHOIS_URL:https://www.isimtescil.net/whois}
cert.monitor.domain.trabis-whois-url=${DOMAIN_TRABIS_WHOIS_URL:https://www.trabis.gov.tr}
cert.monitor.domain.trabis-whois43-host=${DOMAIN_TRABIS_WHOIS43_HOST:whois.trabis.gov.tr}
# RDAP istek timeout'u (ms) — monitör başına "Kontrol Timeout" alanı boşsa bu global kullanılır (1–30 sn'ye kısılır).
cert.monitor.domain.rdap-timeout-ms=${DOMAIN_RDAP_TIMEOUT_MS:6000}
cert.monitor.domain.default-warning-days=${DOMAIN_DEFAULT_WARNING_DAYS:30}
cert.monitor.domain.default-critical-days=${DOMAIN_DEFAULT_CRITICAL_DAYS:7}
cert.monitor.domain.default-thresholds=${DOMAIN_DEFAULT_THRESHOLDS:60,30,14,7,3,1}
# Kritik domainler için İKİNCİ günlük kontrol — yalnız son kontrolünde days_remaining ≤ eşik olan aktif domainleri
# tekrar sorgular (RDAP dostu, ayrı scheduler_lock). Amaç: gün içinde YENİLENEN domainin açık alarmı aynı gün kapansın.
# Yeni bildirim ÜRETMEZ (günlük re-alert dedupe korunur). cron Europe/Istanbul; kapatmak için critical-check-enabled=false.
cert.monitor.domain.critical-check-cron=${DOMAIN_CRITICAL_CHECK_CRON:0 0 16 * * *}
cert.monitor.domain.critical-check-threshold-days=${DOMAIN_CRITICAL_CHECK_THRESHOLD_DAYS:7}
cert.monitor.domain.critical-check-enabled=${DOMAIN_CRITICAL_CHECK_ENABLED:true}
cert.monitor.expiry.alert-enabled=${EXPIRY_ALERT_ENABLED:true}
# Kontrol sıklığı (per-monitör intervalSeconds) + request timeout — yeni monitör VARSAYILANLARI.
cert.monitor.ping.default-interval-seconds=${PING_DEFAULT_INTERVAL_SECONDS:60}
cert.monitor.keyword.default-interval-seconds=${KEYWORD_DEFAULT_INTERVAL_SECONDS:60}
cert.monitor.port.default-interval-seconds=${PORT_DEFAULT_INTERVAL_SECONDS:60}
cert.monitor.ping.default-timeout-ms=${PING_DEFAULT_TIMEOUT_MS:5000}
cert.monitor.keyword.default-timeout-ms=${KEYWORD_DEFAULT_TIMEOUT_MS:10000}
cert.monitor.keyword.default-slow-ms=${KEYWORD_DEFAULT_SLOW_MS:3000}
cert.monitor.port.default-timeout-ms=${PORT_DEFAULT_TIMEOUT_MS:5000}
cert.monitor.port.default-slow-ms=${PORT_DEFAULT_SLOW_MS:3000}
cert.monitor.http.default-interval-seconds=${HTTP_DEFAULT_INTERVAL_SECONDS:300}
cert.monitor.domain.default-interval-seconds=${DOMAIN_DEFAULT_INTERVAL_SECONDS:86400}
cert.monitor.http.default-timeout-ms=${HTTP_DEFAULT_TIMEOUT_MS:10000}
cert.monitor.uptime.confirm-attempts=${UPTIME_CONFIRM_ATTEMPTS:3}
cert.monitor.uptime.confirm-delay-ms=${UPTIME_CONFIRM_DELAY_MS:30000}
# Recovery period (global varsayılan): alarmın auto-resolve olması için gereken ardışık başarılı kontrol.
# 1 = ilk başarılı kontrolde kapat (mevcut davranış). Per-monitör recoveryChecks bunu ezer.
cert.monitor.uptime.recovery-checks=${UPTIME_RECOVERY_CHECKS:3}
cert.monitor.uptime.check-timeout-ms=${UPTIME_CHECK_TIMEOUT_MS:10000}
# ACCESSIBILITY (erişilebilirlik) alarmı AKTİF recovery aralığı (ms). Port'un çalışan yolu gibi:
# alarm açıkken bu aralıkla recoveryChecks kadar aktif re-check yapılır → flapping host'ta bile
# erişim dönünce ~recoveryChecks×interval içinde kapanır (pasif "3 ardışık temiz sweep" takılmasını giderir).
cert.monitor.uptime.recovery-interval-ms=${UPTIME_RECOVERY_INTERVAL_MS:30000}

# Sistem admin email — bulk network outage tespit + çözüm bildirimleri için
cert.monitor.system-admin.email=${SYSTEM_ADMIN_EMAIL:erdi.inanmis@gmail.com}

# Login "sorun bildir" özelliği (DB kayıt + admin triyaj + e-posta). Kapalıysa /api/login-help 404.
cert.monitor.login-issues.enabled=${LOGIN_ISSUES_ENABLED:true}
# Sorun-bildirim mailleri (bildirim/onay/çözüldü) SMTP mute'una (SmtpSettings.enabled=false) rağmen gitsin mi.
# Operasyonel bildirim olduğundan varsayılan AÇIK; SMTP config yoksa gönderim SKIP değil FAILED olur (mail geçmişinde görünür).
cert.monitor.login-issues.force-email=${LOGIN_ISSUES_FORCE_EMAIL:true}

# Client IP çözümü (loglardaki gerçek client IP'si) — proxy/LB arkasında hangi forwarding
# başlığının gerçek client'ı taşıdığı ortama göre değişir. Sıralı aday başlık listesi;
# ilk dolu olanın index. parçası kullanılır (XFF: 0=client). /api/admin/client-ip-debug ile
# doğru başlık bulunup buraya yazılır (ör. X-Real-IP). Varsayılan davranış: X-Forwarded-For leftmost.
cert.monitor.client-ip.headers=${CLIENT_IP_HEADERS:X-Forwarded-For}
cert.monitor.client-ip.index=${CLIENT_IP_INDEX:0}

# ─────────────────────────────────────────────────────────────
# Haftalık raporlar — görsel yükleme limitleri
# ─────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${WR_IMAGE_MAX_FILE:10MB}
spring.servlet.multipart.max-request-size=12MB
cert.monitor.weekly-report.image-max-bytes=${WR_IMAGE_MAX_BYTES:8388608}

# Uygulamanın dışarı bakan adresi (mail linkleri için). Prod'da Helm APP_BASE_URL env'inden gelir
# (config.appBaseUrl; boşsa ingress host'undan http/https türetilir). Genel Ayarlar'dan canlı override edilebilir.
cert.monitor.app.base-url=${APP_BASE_URL:http://localhost:5173}

# ─────────────────────────────────────────────────────────────
# Branding (beyaz etiket): login sayfası + uygulama kimliği kurum-özel yapılır; Genel Ayarlar
# benzeri canlı override (restart yok). Boş değer = varsayılan CertMonitor kimliği (frontend
# i18n/gömülü logo fallback'i). banner-version metin her güncellendiğinde otomatik artar
# (BrandingController) — kullanıcı kapattıysa yeni versiyonda şerit yeniden görünür.
cert.monitor.branding.app-name=${BRANDING_APP_NAME:CertMonitor}
cert.monitor.branding.tab-title=${BRANDING_TAB_TITLE:CertMonitor}
cert.monitor.branding.login-title=${BRANDING_LOGIN_TITLE:}
cert.monitor.branding.login-subtitle=${BRANDING_LOGIN_SUBTITLE:}
cert.monitor.branding.signin-label=${BRANDING_SIGNIN_LABEL:}
cert.monitor.branding.username-label=${BRANDING_USERNAME_LABEL:}
cert.monitor.branding.footer-text=${BRANDING_FOOTER_TEXT:}
cert.monitor.branding.primary-color=${BRANDING_PRIMARY_COLOR:}
cert.monitor.branding.logo-data=${BRANDING_LOGO_DATA:}
cert.monitor.branding.banner-enabled=${BRANDING_BANNER_ENABLED:false}
cert.monitor.branding.banner-text=${BRANDING_BANNER_TEXT:}
cert.monitor.branding.banner-link=${BRANDING_BANNER_LINK:}
cert.monitor.branding.banner-link-label=${BRANDING_BANNER_LINK_LABEL:}
cert.monitor.branding.banner-tone=${BRANDING_BANNER_TONE:INFO}
cert.monitor.branding.banner-version=${BRANDING_BANNER_VERSION:0}
# Haftalık rapor cuma hatırlatma cron'u (Europe/Istanbul) — her cuma 09:00
cert.monitor.weekly-report.reminder-cron=${WR_REMINDER_CRON:0 0 9 ? * FRI}
cert.monitor.weekly-report.reminder-enabled=${WR_REMINDER_ENABLED:true}
# Haftalık erişilebilirlik (availability) e-postası — her Pazartesi 10:00 (Europe/Istanbul), sertifika sahibi takıma
cert.monitor.weekly-availability.cron=${WEEKLY_AVAIL_CRON:0 0 10 ? * MON}
cert.monitor.weekly-availability.enabled=${WEEKLY_AVAIL_ENABLED:true}
# Haftalık rapor sağlık skoru (0-100) ağırlıkları — executive özet (WeeklyScoreCalculator, Genel Ayarlar → weekly).
# score = 100 − wCritical·açıkKritik − wExpiring·(tier1-2 ≤30g) − wWeakAlgo·zayıfAlgo − wUptime·(100−tier1Uptime)
cert.monitor.weekly.score.weight-critical=${WEEKLY_SCORE_WEIGHT_CRITICAL:8.0}
cert.monitor.weekly.score.weight-expiring=${WEEKLY_SCORE_WEIGHT_EXPIRING:2.0}
cert.monitor.weekly.score.weight-weak-algo=${WEEKLY_SCORE_WEIGHT_WEAK_ALGO:3.0}
cert.monitor.weekly.score.weight-uptime=${WEEKLY_SCORE_WEIGHT_UPTIME:0.5}

# ─────────────────────────────────────────────────────────────
# Email — disabled by default; configure via env vars
# ─────────────────────────────────────────────────────────────
cert.monitor.email.enabled=${CERT_MONITOR_EMAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
# SMTP timeout'ları — sunucu askıda kalırsa çağıran thread (request/sweep) sonsuz
# bloke olmasın → thread havuzu tükenmesin. connection/read/write ayrı ayrı.
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTIONTIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:15000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITETIMEOUT:15000}
cert.monitor.email.from=${CERT_MONITOR_EMAIL_FROM:noreply@certmonitor}
# Delay between emails to successive contacts within same alert (ms)
mail.send.inter-contact-delay-ms=5000
# Delay between each domain batch during startup catch-up (ms)
mail.catch-up.inter-domain-delay-ms=3000
# How long to wait before retrying a 421 rate-limit rejection (ms)
mail.send.retry-delay-ms=90000

# ─────────────────────────────────────────────────────────────
# Caffeine cache — per-cache TTL CacheConfig.java'da tanımlı (cert dashboard cache'leri 300 sn,
# diğerleri 60 sn). CacheConfig bir CacheManager bean'i sağladığı için aşağıdaki caffeine.spec
# artık KULLANILMAZ (auto-config geri çekilir); yalnız type bilgi amaçlı burada.
# ─────────────────────────────────────────────────────────────
spring.cache.type=caffeine

# ─────────────────────────────────────────────────────────────
# Response compression (performance)
# ─────────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/plain,application/javascript
server.compression.min-response-size=1024

# ─────────────────────────────────────────────────────────────
# Graceful shutdown — wait up to 30 s for in-flight requests (Kubernetes SIGTERM)
# ─────────────────────────────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ─────────────────────────────────────────────────────────────
# Jackson
# ─────────────────────────────────────────────────────────────
spring.jackson.property-naming-strategy=SNAKE_CASE
# Jackson 3 (Spring Boot 4): WRITE_DATES_AS_TIMESTAMPS, SerializationFeature'dan
# DateTimeFeature'a taşındı → spring.jackson.datatype.datetime.* altında.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# ─────────────────────────────────────────────────────────────
# Actuator / Prometheus
# ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.health.mail.enabled=false
management.health.db.enabled=true
management.info.env.enabled=true
# Kubernetes/OpenShift probe grupları → /health/liveness & /health/readiness.
# readiness yalnız readinessState (DB HARİÇ → paylaşılan-DB blip'i tüm pod'ları NotReady yapıp servisi
# komple düşürmesin); warmup boyunca SchedulerService programatik REFUSING_TRAFFIC ile gate eder.
# liveness yalnız livenessState → DB sağlığı asla gereksiz pod restart'ı tetiklemez.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState

# ─────────────────────────────────────────────────────────────
# Logging
# Full configuration is in logback-spring.xml.
#
# Runtime override (env var or -D flag):
#   LOG_LEVEL = ERROR | WARN | INFO | DEBUG | TRACE
#   LOG_DIR   = /absolute/path/to/logs  (default: logs/ in working dir)
#
# Per-profile defaults:
#   local / local-pg → DEBUG
#   prod             → INFO  (set LOG_LEVEL=ERROR for absolute minimal output)
# ─────────────────────────────────────────────────────────────
logging.config=classpath:logback-spring.xml
logging.level.com.certmonitor=${LOG_LEVEL:DEBUG}
logging.level.root=INFO
logging.file.path=${LOG_DIR:logs}

# HTTP request/response gövde + header detayını açmak için (yalnızca RequestLoggingFilter,
# tüm app TRACE'e geçmesin). Açmak için aşağıdaki satırı yorumdan çıkarın veya env var verin:
#   logging.level.com.certmonitor.config.RequestLoggingFilter=TRACE

# Hibernate SQL — set to DEBUG in local-pg profile to see queries
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.web=WARN
