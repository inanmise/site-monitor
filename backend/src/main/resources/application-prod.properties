# Production profile — activated by SPRING_PROFILES_ACTIVE=prod in Kubernetes

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:certmonitor}
spring.datasource.username=${DB_USER:certmonitor}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Session — use database-backed sessions in K8s for HA
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Auth (from K8s Secret)
cert.monitor.username=${ADMIN_USERNAME:admin}
cert.monitor.password=${ADMIN_PASSWORD:changeme}

# CORS — in production, restrict to actual hostname
cert.monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Email
cert.monitor.email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
cert.monitor.email.to=${EMAIL_TO:}
cert.monitor.email.from=${EMAIL_FROM:noreply@certmonitor}

# Actuator
management.endpoint.health.show-details=when-authorized
