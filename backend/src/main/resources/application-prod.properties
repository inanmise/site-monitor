# Production profile — activated by SPRING_PROFILES_ACTIVE=prod in Kubernetes

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:certmonitor}
spring.datasource.username=${DB_USER:certmonitor}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Session — PostgreSQL-backed sessions for HA (survives pod restarts, shared across replicas)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Auth (from K8s Secret)
site.monitor.username=${ADMIN_USERNAME:admin}
site.monitor.password=${ADMIN_PASSWORD}

# CORS — in production, restrict to actual hostname
site.monitor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Email
# geriye-uyum: eski CERT_MONITOR_* env adi fallback olarak desteklenir
site.monitor.email.enabled=${SITE_MONITOR_EMAIL_ENABLED:${CERT_MONITOR_EMAIL_ENABLED:false}}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
# geriye-uyum: eski CERT_MONITOR_* env adi fallback olarak desteklenir
site.monitor.email.from=${SITE_MONITOR_EMAIL_FROM:${CERT_MONITOR_EMAIL_FROM:noreply@sitemonitor}}

# Actuator
management.endpoint.health.show-details=when-authorized

# ─────────────────────────────────────────────────────────────
# Logging — production
# Files written to LOG_DIR (default /var/log/site-monitor in K8s).
# Set LOG_LEVEL=ERROR in env for absolute minimal log output.
# ─────────────────────────────────────────────────────────────
logging.level.com.sitemonitor=${LOG_LEVEL:INFO}
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.file.path=${LOG_DIR:/var/log/site-monitor}
