# In-memory H2 in PostgreSQL compatibility mode — used for unit/integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Session — no external store in unit tests
spring.session.store-type=none
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Auth
site.monitor.username=testuser
site.monitor.password=testpass
site.monitor.login.max-attempts=1000

# Cert checker — no real file needed; scheduler is mocked in tests
site.monitor.cert-list-file=src/test/resources/test-certs.txt
site.monitor.check-timeout-seconds=2
site.monitor.warning-days=30
site.monitor.parallel-workers=4
site.monitor.check-hour=3
site.monitor.check-minute=0

# Email — disabled in tests
site.monitor.email.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
site.monitor.email.from=noreply@test

# Cache — disable in tests so mocked service calls are not cached
spring.cache.type=none

# Compression — off in tests
server.compression.enabled=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.health.mail.enabled=false

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
