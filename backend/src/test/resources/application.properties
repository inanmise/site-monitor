# In-memory SQLite for tests — single connection to share the same in-memory DB
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Session
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Auth
cert.monitor.username=testuser
cert.monitor.password=testpass

# Cert checker — no real file needed; scheduler is mocked in tests
cert.monitor.cert-list-file=src/test/resources/test-certs.txt
cert.monitor.check-timeout-seconds=2
cert.monitor.warning-days=30
cert.monitor.parallel-workers=4
cert.monitor.check-hour=3
cert.monitor.check-minute=0

# Email — disabled in tests
cert.monitor.email.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
cert.monitor.email.to=
cert.monitor.email.from=noreply@test

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/
management.health.mail.enabled=false

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
