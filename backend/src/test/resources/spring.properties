# Spring TestContext önbelleği SINIRI (2026-09-27, CI OutOfMemoryError).
# KONUM: sınıf yolunun KÖKÜ (SpringProperties yalnız "spring.properties" arar; META-INF altında OKUNMAZ —
# ilk düzeltme orada olduğu için etkisizdi). Kapı: SpringTestPropertiesTest.
#
# 73 test sınıfı (@WebMvcTest / @SpringBootTest) her biri farklı @MockitoBean kümesiyle KENDİ bağlamını kurar.
# Spring varsayılan olarak 32 bağlamı önbellekte tutar; surefire fork'u -Xmx1g ile koşar. Yeni denetleyici
# testleri eklendikçe canlı bağlam sayısı arttı ve CI (Linux, farklı test sırası) UptimeOrgVisibilityTest bağlamını
# yüklerken "Java heap space" ile düştü — yerelde (Windows sırası) yeşildi. En son kullanılanlardan 12'si tutulur,
# gerisi kapatılır: bellek test sayısıyla büyümez; aynı yapılandırmayı paylaşan ardışık sınıflar yine yeniden kullanır.
spring.test.context.cache.maxSize=12
